name: Issue64 Engineering Cold Qt Paint Attribution

on:
  push:
    branches: [eng/issue64-cold-paint-attribution-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue64-cold-paint-attribution
  cancel-in-progress: true

jobs:
  cold-paint:
    name: Real Qt cold paint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Guard PR68 exact source and diagnostic-only two-file diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2ac5412cd38bf7cc430fd9f4bc7456730c674aa2 HEAD
          git diff --name-only 2ac5412cd38bf7cc430fd9f4bc7456730c674aa2..HEAD | python -c "import sys; expected={'tests/test_issue64_cold_paint_attribution.py','.github/workflows/issue64-cold-paint-attribution.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile diagnostic
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tests/test_issue64_cold_paint_attribution.py
      - name: Measure cold Qt startup and actual headline-language CPU
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue64_cold_paint_attribution.py
      - name: No tracked file mutations
        if: always()
        shell: bash
        run: git diff --exit-code
