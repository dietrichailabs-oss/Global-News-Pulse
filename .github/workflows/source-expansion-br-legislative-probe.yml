name: Source Expansion - Brazil Legislative RSS Pre-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-br-legislative-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  brazil-legislature-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install exact pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Existing parser and publisher grouping regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_open_feeds.py tests/test_issue22_publisher_origin_group.py
      - name: Direct official legislative RSS with real bounded Collector (no admission)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          candidates=[
              ("br_camara_all","Agencia Camara - latest news","https://www.camara.leg.br/noticias/rss/ultimas-noticias","br_camara","Government"),
              ("br_camara_health","Agencia Camara - health","https://www.camara.leg.br/noticias/rss/dinamico/SAUDE","br_camara","Health"),
              ("br_camara_economy","Agencia Camara - economy","https://www.camara.leg.br/noticias/rss/dinamico/ECONOMIA","br_camara","Economy"),
              ("br_senado_news","Agencia Senado - publisher RSS candidate","https://www12.senado.leg.br/noticias/rss.xml","br_senado","Government"),
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,name,url,origin,category) in enumerate(candidates):
              if i: time.sleep(4)
              host=urlsplit(url).hostname
              article_hosts=["www.camara.leg.br","camara.leg.br"] if origin=="br_camara" else ["www12.senado.leg.br","www.senado.leg.br","senado.leg.br"]
              s=dict(id=sid,name=name,url=url,adapter="rss",enabled=True,metadata_only=True,
                access_status="reviewed_public",independence="original",official=True,official_scope="statement",
                category=category,region="South America",country="Brazil",language="pt",
                publisher_origin_id=origin,min_interval=3600,stale_after_days=30,retention_days=90,
                allowed_domains=[host],article_domains=article_hosts,
                attribution=name+"; original publisher headline and direct link; Brazilian legislature, no endorsement")
              try:
                  out=Collector(s).collect();st=out["state"];reports=out["reports"]
                  recent=[v for v in reports if v.get("published_at") and 0<=now-timestamp(v["published_at"])<=30*86400]
                  bad=[v for v in reports if not v.get("title") or not v.get("published_at") or not v.get("attribution")
                    or v.get("summary") or v.get("media") or v.get("origin_id")!=origin
                    or v.get("original_url")!=v.get("url") or v.get("country_basis")!="publisher_coverage"
                    or v.get("latitude") is not None or v.get("longitude") is not None
                    or urlsplit(v.get("url","")).scheme!="https" or urlsplit(v.get("url","")).hostname not in article_hosts]
                  eligible=bool(st.get("status")=="available" and st.get("http_status")==200 and reports and recent and not bad)
                  data=dict(id=sid,technical_eligible=eligible,http_status=st.get("http_status"),status=st.get("status"),
                    reports=len(reports),recent_30d=len(recent),latest=st.get("latest_publication"),
                    violations=len(bad),error=st.get("error",""),publisher_origin_id=origin,
                    sample_original_links=[v.get("original_url") for v in reports[:3]],
                    sample_titles=[v.get("title") for v in reports[:2]],rights_gate="INDEPENDENT_REVIEW_REQUIRED")
              except Exception as e:
                  data=dict(id=sid,technical_eligible=False,error=type(e).__name__+":"+str(e)[:140])
              print("BRAZIL_LEGISLATIVE_PROBE",json.dumps(data,ensure_ascii=False,sort_keys=True),flush=True)
          print("NO_CATALOG_MUTATION_NO_RELEASE",flush=True)
          PY
