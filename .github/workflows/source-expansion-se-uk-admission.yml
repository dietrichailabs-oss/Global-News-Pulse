name: Source Expansion - Sweden SCB and UK Met Office Post-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-se-uk-admission.yml
      - tests/test_source_expansion_se_uk.py
      - global_pulse/resources/sources.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline provenance, parser, attribution, media, and independent-origin regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_se_uk.py tests/test_issue22_publisher_origin_group.py
      - name: Strict actual Collector re-admission from committed enabled catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp
          expected={
            "se_scb_statistics":("se_scb","https://www.scb.se/Feed/statistiknyheter/"),
            "uk_metoffice_news":("uk_metoffice","https://www.metoffice.gov.uk/feed/syndication/news-rss.xml"),
          }
          catalog={s["id"]:s for s in load_catalog()}
          now=datetime.now(timezone.utc).timestamp()
          failures=[]
          for i,(sid,(origin,url)) in enumerate(expected.items()):
              if i: time.sleep(4)
              row=catalog[sid]
              assert row["enabled"] and row["metadata_only"] and row["publisher_origin_id"]==origin
              assert row["url"]==url and row["access_status"]=="reviewed_public"
              assert row["min_interval"]>=3600 and row["license_url"] and row["feed_documentation"]
              output=Collector(row).collect()
              state=output["state"]; reports=output["reports"]
              recent=[r for r in reports if r.get("published_at")
                and 0<=now-timestamp(r["published_at"])<=30*86400]
              invalid=[r for r in reports if not r.get("title") or not r.get("published_at")
                or not r.get("attribution") or r.get("summary") or r.get("media")
                or r.get("origin_id")!=origin or r.get("country_basis")!="publisher_coverage"
                or r.get("original_url")!=r.get("url")
                or urlsplit(r.get("url","")).scheme!="https"
                or urlsplit(r.get("url","")).hostname not in row["article_domains"]]
              passed=bool(state.get("status")=="available" and state.get("http_status")==200
                and reports and recent and not invalid)
              record=dict(id=sid,origin=origin,passed=passed,status=state.get("status"),
                http_status=state.get("http_status"),reports=len(reports),recent_30d=len(recent),
                latest=state.get("latest_publication") or "",violations=len(invalid),
                error=state.get("error") or "")
              print("SE_UK_POST_ADMISSION",json.dumps(record,sort_keys=True),flush=True)
              if not passed: failures.append(sid)
          if failures:raise SystemExit("SE_UK_ADMISSION_FAILURE: "+",".join(failures))
          print("SE_UK_TWO_SOURCES_POST_ADMISSION_PASS",flush=True)
          PY
