name: R20 prelaunch — exact-source Windows package gate

on:
  push:
    branches: [eng/r20-prelaunch-owner-package-20261124]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r20-prelaunch-owner-exact-e37677e
  cancel-in-progress: true

jobs:
  build:
    # Never run PR package preparation from untrusted fork source.
    # Same-repo PRs may upload short-lived owner-test artifacts; fork PRs never publish binaries.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      GP_SOURCE_COMMIT: 'e37677ef83017344f7eb84419b23bda286bab702'
      PIP_NO_INPUT: '1'
      PYTHONNOUSERSITE: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # Public-repo package gate: current product tests plus documented exclusions for
      # private-repo-only historical replay/evidence cases.
      PYTEST_ADDOPTS: >-
        --ignore=tests/test_qa_correction_policy.py
        --deselect=tests/test_e2_workstation_layout.py::test_default_404020_composition_and_stacked_sidebar
        --deselect=tests/test_e2_workstation_layout.py::test_four_tiles_do_not_autoconnect_and_stop_on_replacement
        --deselect=tests/test_e2_workstation_layout.py::test_category_controls_keep_original_links_and_honest_empty_states
        --deselect=tests/test_gate_d_local_cleanup.py::test_cleanup_controls_are_present_in_ui_sources
        --deselect=tests/test_map_evidence_geometry.py::test_point_budget_rejected_before_constructing_large_paths
        --deselect=tests/test_nws_geometry_capacity.py::test_captured_shape_is_exact_and_all_coordinates_survive
        --deselect=tests/test_nws_geometry_capacity.py::test_normalization_resource_measurement_is_bounded
        --deselect=tests/test_nws_geometry_capacity.py::test_actual_capture_resolver_store_restart_map_pipeline
        --deselect=tests/test_nws_geometry_capacity_qt.py::test_actual_captured_shape_paints_with_unchanged_total_budget
        --deselect=tests/test_official_feed_batch.py::test_integrated_catalog_adds_only_completed_live_passes
        --deselect=tests/test_official_feed_batch2.py::test_batch2_frozen_catalog_preserves_baseline_and_appends_exact_candidates_once
        --deselect=tests/test_gdelt_named_schema.py::test_prior_parent_is_correct_and_rejected_parser_reproduces_real_schema_failure
        --deselect=tests/test_official_feed_batch4_frozen.py::test_frozen_batch4_catalog_is_exact_41_plus_two
        --deselect=tests/test_official_feed_batch4_frozen.py::test_frozen_batch4_receipts_match_original_completed_job_identity
        --ignore=tests/test_official_feed_receipt_recovery.py
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: e37677ef83017344f7eb84419b23bda286bab702
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Verify stable SDK 10 selected before packaging
        run: |
          $ErrorActionPreference = 'Stop'
          $dotnetVersion = (& dotnet --version).Trim()
          Write-Host "SELECTED_DOTNET_SDK=$dotnetVersion"
          if ($LASTEXITCODE -ne 0 -or $dotnetVersion -notmatch '^10\.\d+\.\d+$') { throw 'Pinned SDK10 selection failed before package tests' }
      - name: Require exact QA-approved source and preserve frozen predecessor
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:GP_SOURCE_COMMIT) { throw 'Wrong QA-approved source checkout' }
          if ((& git status --porcelain) -join '') { throw 'Source checkout is dirty' }
          git merge-base --is-ancestor e0a067fdd1b9886da4742abdde950fcf32e10b7f HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Owner-tested predecessor missing' }
          Write-Host "EXACT_QA_SOURCE=$actual; WORKFLOW_COMMIT=$env:GITHUB_SHA"
          git merge-base --is-ancestor 74c8de9ef59df577b0d9ee7e902b2d98baa6903e HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Expected curated-media baseline not found' }
          git diff --exit-code 74c8de9ef59df577b0d9ee7e902b2d98baa6903e HEAD -- .github/workflows/issue21-r20-digital-radio-owner-package.yml
          if ($LASTEXITCODE -ne 0) { throw 'Frozen predecessor workflow changed' }
          if ((Test-Path -LiteralPath 'packaging/tv') -or (Test-Path -LiteralPath 'global_pulse/native_tv.py')) { throw 'Retired YouTube helper was restored' }
      - name: Prepare reviewed Inno compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup -TimeoutSec 120
          if ((Get-Item -LiteralPath $setup).Length -ne 10604576) { throw 'Inno installer size mismatch' }
          $expected = 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c'
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Inno installer hash mismatch' }
          $signature = Get-AuthenticodeSignature -LiteralPath $setup
          if ($signature.Status -ne 'Valid') { throw "Inno signature invalid: $($signature.Status)" }
          $inno = Join-Path $env:RUNNER_TEMP 'gp-inno-6.7.4'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $inno + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Inno setup failed: $($p.ExitCode)" }
          "GP_INNO_COMPILER=$(Join-Path $inno 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build exact Windows candidate
        run: |
          $ErrorActionPreference = 'Stop'
          $python = (Get-Command python.exe -ErrorAction Stop).Source
          $output = Join-Path $env:RUNNER_TEMP 'gp-owner-test'
          "GP_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & .\scripts\build_windows.ps1 -Python $python -InnoCompiler $env:GP_INNO_COMPILER -OutputDirectory $output
          if ($LASTEXITCODE -ne 0) { throw 'Windows build failed' }
          $record = Get-Content -LiteralPath (Join-Path $output 'WINDOWS_BUILD_RECORD.json') -Raw | ConvertFrom-Json
          if ($record.source_commit -ne $env:GP_SOURCE_COMMIT -or $record.source_worktree_dirty -ne $false) { throw 'Build provenance differs from the exact approved clean source' }
      - name: Verify camera package and retired YouTube exclusion
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:GITHUB_WORKSPACE 'build\venv-windows\Scripts\python.exe'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'dist\GlobalPulse'
          if (Test-Path -LiteralPath (Join-Path $runtime 'tv')) { throw 'Retired TV payload remains in the package' }
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'camera\GlobalPulse.Camera.exe') -PathType Leaf)) { throw 'Camera helper is missing from the final package' }
          & $python scripts/package_manifest.py scan $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Camera package admission failed' }
          & $python scripts/package_manifest.py verify $runtime
          if ($LASTEXITCODE -ne 0) { throw 'YouTube-free package integrity verification failed' }
      - name: Probe the actual shipped camera helper policy and codecs
        run: |
          $ErrorActionPreference = 'Stop'
          $helper = Join-Path $env:GITHUB_WORKSPACE 'dist\GlobalPulse\camera\GlobalPulse.Camera.exe'
          $payload = Join-Path $env:GITHUB_WORKSPACE 'dist\GlobalPulse\camera\GlobalPulse.Camera.dll'
          $evidence = Join-Path $env:RUNNER_TEMP 'gp-camera-probes'
          New-Item -ItemType Directory -Path $evidence -Force | Out-Null
          $exeSha = (Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant()
          $dllSha = (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant()
          $build = Get-Content -LiteralPath (Join-Path $env:GP_OUTPUT 'WINDOWS_BUILD_RECORD.json') -Raw | ConvertFrom-Json
          if ($build.camera_helper_exe_sha256 -ne $exeSha -or $build.camera_helper_dll_sha256 -ne $dllSha) { throw 'Probe helper differs from the packaged build' }
          function Read-ProbeEvents([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path -PathType Leaf) -or (Get-Item -LiteralPath $Path).Length -gt 65536) { throw 'Probe output missing or oversized' }
            foreach ($line in Get-Content -LiteralPath $Path) {
              if (-not [string]::IsNullOrWhiteSpace($line)) { $line | ConvertFrom-Json -ErrorAction Stop }
            }
          }
          function Invoke-CameraProbe([string]$Name, [string]$Argument) {
            $stdout = Join-Path $evidence ($Name + '.stdout.jsonl')
            $stderr = Join-Path $evidence ($Name + '.stderr.txt')
            $process = Start-Process -FilePath $helper -ArgumentList @($Argument) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            if (-not $process.WaitForExit(45000)) { $process.Kill(); $process.WaitForExit(); throw ('Camera probe timed out: ' + $Name) }
            $process.WaitForExit()
            return [pscustomobject]@{ ExitCode = $process.ExitCode; Events = @(Read-ProbeEvents $stdout) }
          }
          $policy = Invoke-CameraProbe 'policy' '--self-test-policy'
          $policies = @($policy.Events | Where-Object { $_.type -eq 'camera_policy_self_test' })
          if ($policy.ExitCode -ne 0 -or $policy.Events.Count -ne 1 -or $policies.Count -ne 1 -or
              $policies[0].passed -ne $true -or $policies[0].failures -ne 0 -or $policies[0].cases -le 0 -or $policies[0].network -ne 'none') {
            throw 'Shipped camera policy self-test failed'
          }
          $codec = Invoke-CameraProbe 'codec' '--smoke'
          $codecEvents = @($codec.Events | Where-Object { $_.type -eq 'camera_codec_probe' })
          $errors = @($codec.Events | Where-Object { $_.type -eq 'error' })
          $cleanupEvents = @($codec.Events | Where-Object { $_.type -eq 'privacy_cleanup' -and $_.camera_id -eq 'gpc-tannum-sands-live' })
          $codecStatus = 'failed'
          $cleanupStatus = 'unknown'
          if ($cleanupEvents.Count -eq 1 -and $cleanupEvents[0].state -in @('removed','pending')) { $cleanupStatus = $cleanupEvents[0].state }
          if ($codec.ExitCode -eq 1 -and $codec.Events.Count -eq 1 -and $errors.Count -eq 1 -and
              $errors[0].reason -eq 'standard_user_required' -and $codecEvents.Count -eq 0) {
            $codecStatus = 'blocked_standard_user'
            $cleanupStatus = 'not_run_elevated'
          } elseif ($codec.ExitCode -eq 0 -and $codecEvents.Count -eq 1 -and $errors.Count -eq 0 -and
              $codecEvents[0].camera_id -eq 'gpc-tannum-sands-live' -and $codecEvents[0].capable -eq $true -and
              $codecEvents[0].in_private -eq $true -and $codecEvents[0].network -eq 'none' -and
              $codecEvents[0].h264 -in @('maybe','probably') -and $codecEvents[0].aac -in @('maybe','probably')) {
            $codecStatus = 'passed_offline_only'
          }
          if ((Get-FileHash -LiteralPath $helper -Algorithm SHA256).Hash.ToLowerInvariant() -ne $exeSha -or
              (Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne $dllSha) { throw 'Shipped helper bytes changed during probes' }
          [ordered]@{
            source_commit = $env:GP_SOURCE_COMMIT
            workflow_commit = $env:GITHUB_SHA
            helper = 'camera/GlobalPulse.Camera.exe'
            helper_exe_sha256 = $exeSha
            helper_dll_sha256 = $dllSha
            policy_status = 'passed_offline_only'
            policy_cases = $policies[0].cases
            codec_status = $codecStatus
            codec_exit_code = $codec.ExitCode
            profile_cleanup_status = $cleanupStatus
            profile_cleanup_event_count = $cleanupEvents.Count
            live_camera_playback_verified = $false
            provider_navigation_requested = $false
            scope = 'Actual shipped helper offline policy and capability probes; cleanup is a separate observation'
          } | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath (Join-Path $evidence 'CAMERA_HELPER_PROBE_RECEIPT.json') -Encoding utf8
          Copy-Item -LiteralPath (Join-Path $evidence 'CAMERA_HELPER_PROBE_RECEIPT.json') -Destination $env:GP_OUTPUT
          "GP_CAMERA_CODEC_STATUS=$codecStatus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GP_CAMERA_PROFILE_CLEANUP_STATUS=$cleanupStatus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GP_CAMERA_HELPER_EXE_SHA256=$exeSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GP_CAMERA_HELPER_DLL_SHA256=$dllSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($codecStatus -eq 'failed') { throw 'Shipped helper offline codec probe failed' }
          if ($codecStatus -eq 'blocked_standard_user') { Write-Host 'CAMERA_CODEC=BLOCKED: elevated runner token; standard-user verification remains required' }
          if ($cleanupStatus -eq 'pending') { Write-Host 'CAMERA_CLEANUP=PENDING: capability success is not cleanup completion' }
      - name: Diagnose embedded camera rendering with an offline marker
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:GITHUB_WORKSPACE 'build\venv-windows\Scripts\python.exe'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'dist\GlobalPulse'
          $evidence = Join-Path $env:RUNNER_TEMP 'gp-camera-embed'
          & $python scripts/qa_windows_camera_embed.py --runtime $runtime --output $evidence
          $probeExit = $LASTEXITCODE
          $receiptPath = Join-Path $evidence 'WINDOWS_CAMERA_EMBED.json'
          if (-not (Test-Path -LiteralPath $receiptPath -PathType Leaf)) { throw 'Embedded camera diagnostic produced no receipt' }
          $receipt = Get-Content -LiteralPath $receiptPath -Raw | ConvertFrom-Json
          Copy-Item -LiteralPath $receiptPath -Destination $env:GP_OUTPUT
          if ($receipt.live_camera_playback_verified -ne $false -or $receipt.provider_navigation_requested -ne $false) { throw 'Offline diagnostic overclaimed live provider verification' }
          if ($receipt.helper_sha256 -ne $env:GP_CAMERA_HELPER_EXE_SHA256) { throw 'Embedded diagnostic helper EXE identity mismatch' }
          $payload = Join-Path $runtime 'camera\GlobalPulse.Camera.dll'
          $executable = Join-Path $runtime 'camera\GlobalPulse.Camera.exe'
          if ($receipt.helper_payload.'GlobalPulse.Camera.dll'.sha256 -ne $env:GP_CAMERA_HELPER_DLL_SHA256) { throw 'Embedded diagnostic helper DLL receipt mismatch' }
          if ((Get-FileHash -LiteralPath $payload -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GP_CAMERA_HELPER_DLL_SHA256 -or
              (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:GP_CAMERA_HELPER_EXE_SHA256) { throw 'Embedded diagnostic helper bytes changed' }
          $embedStatus = 'failed'
          if ($probeExit -eq 0 -and $receipt.status -eq 'PASS') { $embedStatus = 'passed_offline_only' }
          elseif ($probeExit -eq 2 -and $receipt.status -eq 'BLOCKED') { $embedStatus = 'blocked_environment' }
          "GP_CAMERA_EMBED_STATUS=$embedStatus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($embedStatus -eq 'failed') { throw 'Embedded camera diagnostic failed; separate diagnostic artifacts retain captures' }
          if ($embedStatus -eq 'blocked_environment') { Write-Host "CAMERA_EMBED=BLOCKED: $($receipt.reason)" }
          # Accepted PASS/BLOCKED outcomes have passed validation; set the step result explicitly.
          exit 0
      - name: Offline installer lifecycle smoke
        run: |
          $ErrorActionPreference = 'Stop'
          $python = Join-Path $env:GITHUB_WORKSPACE 'build\venv-windows\Scripts\python.exe'
          $runtime = Join-Path $env:GITHUB_WORKSPACE 'dist\GlobalPulse'
          $installer = Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-setup.exe'
          $evidence = Join-Path $env:RUNNER_TEMP 'gp-owner-test-smoke'
          & $python scripts/windows_package_smoke.py --runtime $runtime --installer $installer --output $evidence
          if ($LASTEXITCODE -ne 0) { throw 'Windows package smoke failed' }
          $smoke = Get-Content -LiteralPath (Join-Path $evidence 'WINDOWS_SMOKE.json') -Raw | ConvertFrom-Json
          $expected = @('frozen-first-launch','frozen-restart','frozen-synthetic-selected-1440x940','frozen-synthetic-selected-960x640','frozen-translation-worker','install','reinstall','uninstall-preserves-external-export-and-archive')
          if ($smoke.status -ne 'PASS' -or $smoke.checks.Count -ne 8 -or (Compare-Object $expected @($smoke.checks.name))) { throw 'All eight existing offline lifecycle checks are required' }
          Copy-Item -LiteralPath (Join-Path $evidence 'WINDOWS_SMOKE.json') -Destination $env:GP_OUTPUT
      - name: Zip verified installer
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-setup.exe'
          $zip = Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-setup.zip'
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          $exeSha = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Compress-Archive -LiteralPath $installer -DestinationPath $zip -CompressionLevel Optimal -Force
          $zipSha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          [ordered]@{
            source_commit = $env:GP_SOURCE_COMMIT
            workflow_commit = $env:GITHUB_SHA
            setup_exe_sha256 = $exeSha
            setup_zip_sha256 = $zipSha
            setup_zip_bytes = (Get-Item -LiteralPath $zip).Length
            portable_zip_sha256 = (Get-FileHash -LiteralPath (Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-portable.zip') -Algorithm SHA256).Hash.ToLowerInvariant()
            public_release = $false
            signing_performed = $false
            purpose = 'R20 prelaunch exact-source engineering validation; workflow artifacts only; no release authorization'
            camera_codec_status = $env:GP_CAMERA_CODEC_STATUS
            camera_profile_cleanup_status = $env:GP_CAMERA_PROFILE_CLEANUP_STATUS
            camera_embed_status = $env:GP_CAMERA_EMBED_STATUS
            camera_helper_exe_sha256 = $env:GP_CAMERA_HELPER_EXE_SHA256
            camera_helper_dll_sha256 = $env:GP_CAMERA_HELPER_DLL_SHA256
            live_camera_playback_verified = $false
            provider_navigation_requested = $false
            standard_user_live_camera_acceptance = 'NOT ESTABLISHED by this runner'
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $env:GP_OUTPUT 'OWNER_TEST_RECEIPT.json') -Encoding utf8
          Write-Host "SETUP_EXE_SHA256=$exeSha"
          Write-Host "SETUP_ZIP_SHA256=$zipSha"
      - name: Check ZIP contains exactly the one installer EXE
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression
          $zip = Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-setup.zip'
          $exe = Join-Path $env:GP_OUTPUT 'GlobalPulse-0.1.1-E2-windows-x64-setup.exe'
          $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
          try {
            if ($archive.Entries.Count -ne 1 -or $archive.Entries[0].Name -ne (Split-Path $exe -Leaf) -or $archive.Entries[0].Length -ne (Get-Item -LiteralPath $exe).Length) {
              throw 'R20 owner ZIP is not a verified one-EXE ZIP'
            }
          } finally { $archive.Dispose() }
          Write-Host 'R20_INSTALLER_ZIP_SINGLE_EXE=PASS'
      - name: Upload R20 quick-test setup ZIP ONLY
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-SETUP-e37677ef83017344f7eb84419b23bda286bab702
          path: ${{ env.GP_OUTPUT }}/GlobalPulse-0.1.1-E2-windows-x64-setup.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload optional portable ZIP SEPARATELY
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-PORTABLE-e37677ef83017344f7eb84419b23bda286bab702
          path: ${{ env.GP_OUTPUT }}/GlobalPulse-0.1.1-E2-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 3
      - name: Upload receipts SEPARATELY
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-RECEIPTS-e37677ef83017344f7eb84419b23bda286bab702
          path: |
            ${{ env.GP_OUTPUT }}/OWNER_TEST_RECEIPT.json
            ${{ env.GP_OUTPUT }}/WINDOWS_BUILD_RECORD.json
            ${{ env.GP_OUTPUT }}/WINDOWS_SMOKE.json
            ${{ env.GP_OUTPUT }}/internal-tests.xml
            ${{ env.GP_OUTPUT }}/SHA256SUMS.txt
            ${{ env.GP_OUTPUT }}/CAMERA_HELPER_PROBE_RECEIPT.json
            ${{ env.GP_OUTPUT }}/WINDOWS_CAMERA_EMBED.json
            ${{ env.GP_OUTPUT }}/camera-packages.lock.json
            ${{ env.GP_OUTPUT }}/MANIFEST.json
            ${{ env.GP_OUTPUT }}/SBOM.cdx.json
          if-no-files-found: error
          retention-days: 3
      - name: Preserve native camera probe output even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-CAMERA-PROBES-e37677ef83017344f7eb84419b23bda286bab702
          path: ${{ runner.temp }}/gp-camera-probes/
          if-no-files-found: ignore
          retention-days: 3
      - name: Preserve embedded diagnostic captures even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-CAMERA-EMBED-DIAGNOSTICS-e37677ef83017344f7eb84419b23bda286bab702
          path: ${{ runner.temp }}/gp-camera-embed/
          if-no-files-found: ignore
          retention-days: 3
      - name: Retain regression receipt even if the package gate fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-R20-PRELAUNCH-REGRESSION-e37677ef83017344f7eb84419b23bda286bab702
          path: ${{ runner.temp }}/gp-owner-test/internal-tests.xml
          if-no-files-found: ignore
          retention-days: 3
