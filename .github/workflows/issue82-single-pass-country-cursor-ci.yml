name: Issue82 Single Pass Country Map - Exact Projection CI

on:
  push:
    branches: [eng/issue82-single-pass-country-cursor-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue82-single-pass-country-cursor
  cancel-in-progress: true

jobs:
  focused-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm exact QA-reviewed PR89 parent and three-path single-cursor source scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d98b1a9f5f05a8518ed126acc56bf08ddb4fb5bf HEAD
          git diff --name-only d98b1a9f5f05a8518ed126acc56bf08ddb4fb5bf..HEAD | python -c "import sys; expected={'global_pulse/core.py','tests/test_issue82_batched_map_country_evidence.py','.github/workflows/issue82-single-pass-country-cursor-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Match native Windows Qt layout and font backend
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Syntax and source compile
        shell: bash
        run: python -m compileall -q global_pulse tests/test_issue82_batched_map_country_evidence.py
      - name: Exact old/new map evidence, clock, country, source and Qt regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue82_batched_map_country_evidence.py tests/test_issue82_collector_tray_latency.py tests/test_e2_temporal_evidence.py tests/test_issue22_situation_stars.py tests/test_ui_desktop.py tests/test_issue64_gui_latency_profile.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_owner_feedback_qa_repairs.py
      - name: Check tracked product cleanliness
        if: always()
        shell: bash
        run: git diff --exit-code
