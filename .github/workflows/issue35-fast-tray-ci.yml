name: Issue35 Fast Close-to-Tray Engineering CI

on:
  push:
    branches: [eng/issue35-fast-close-to-tray-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue35-fast-tray
  cancel-in-progress: true

jobs:
  tray-regressions:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Compile
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Qt close-to-tray and lifecycle regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_ui_desktop.py tests/test_issue22_media_map_composition.py
      - name: Verify tracked source unchanged
        if: always()
        shell: bash
        run: git diff --exit-code
