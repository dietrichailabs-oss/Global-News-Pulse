name: Source Expansion - US Federal Reserve Topic RSS Post-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-fed-topics-post-admission.yml
      - global_pulse/resources/sources.json
      - tests/test_source_expansion_fed_topics.py
  workflow_dispatch:
permissions: {contents: read}
jobs:
  fed-post-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env: {PYTHONUTF8: '1', PYTHONNOUSERSITE: '1', PIP_NO_INPUT: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline parser provenance and publisher-origin regressions
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_fed_topics.py tests/test_issue22_publisher_origin_group.py tests/test_source_expansion_open_feeds.py
      - name: Committed catalog direct Collector live admission on actual publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp
          catalog={s["id"]:s for s in load_catalog()}
          ids=("fed_enforcement","fed_monetary")
          now=datetime.now(timezone.utc).timestamp()
          failures=[]
          for i,sid in enumerate(ids):
            if i:time.sleep(4)
            source=catalog[sid]
            out=Collector(source).collect();st=out["state"];rs=out.get("reports",[])
            fresh=[r for r in rs if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
            bad=[r for r in rs if not r.get("title") or not r.get("published_at")
              or r.get("url")!=r.get("original_url") or not r.get("original_url")
              or r.get("summary") or r.get("media")
              or r.get("origin_id")!="federal_reserve_press"
              or r.get("attribution")!=source["attribution"]
              or r.get("country_basis")!="publisher_coverage"
              or r.get("latitude") is not None or r.get("longitude") is not None
              or urlsplit(r.get("url","")).scheme!="https"
              or urlsplit(r.get("url","")).hostname!="www.federalreserve.gov"]
            passed=bool(st.get("status")=="available" and st.get("http_status")==200
              and source["enabled"] and source["metadata_only"]
              and source["publisher_origin_id"]=="federal_reserve_press"
              and rs and fresh and not bad)
            evidence=dict(id=sid,passed=passed,http_status=st.get("http_status"),
              status=st.get("status"),reports=len(rs),recent_30d=len(fresh),
              violations=len(bad),latest=st.get("latest_publication"),
              error=st.get("error",""),publisher_origin_id=source["publisher_origin_id"],
              original_urls=[r.get("original_url") for r in rs[:2]])
            print("FED_TOPIC_POST_ADMISSION",json.dumps(evidence,sort_keys=True),flush=True)
            if not passed:failures.append(sid)
          if failures:raise SystemExit("FED topic post-admission FAIL: "+", ".join(failures))
          print("PASS 2/2; grouped with existing federal_reserve_press source; no article bodies or media",flush=True)
          PY
