name: Source Expansion - Global Diversity Pre-Admission Probe
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-global-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-official-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned direct-feed parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Discover publisher-declared INEGI RSS URLs without enabling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin,urlsplit
          from urllib.request import Request,urlopen
          class LinkReader(HTMLParser):
              def __init__(self): super().__init__(); self.links=[]
              def handle_starttag(self,t,a):
                  if t=="a":
                      d=dict(a)
                      if "href" in d: self.links.append(d["href"])
          url="https://www.inegi.org.mx/servicios/rss/"
          try:
              with urlopen(Request(url,headers={"User-Agent":"GlobalNewsPulse-SourceAdmission/1.0"}),timeout=12) as r: html=r.read(400000).decode("utf-8","replace")
              p=LinkReader(); p.feed(html)
              urls=sorted({urljoin(url,l) for l in p.links if any(w in l.lower() for w in ("rss","feed","xml"))})
              for u in urls:
                  if urlsplit(u).hostname in {"www.inegi.org.mx","inegi.org.mx","en.www.inegi.org.mx"}: print("INEGI_OFFICIAL_RSS_LINK",u,flush=True)
              print("INEGI_DISCOVERY_COUNT",len(urls),flush=True)
          except Exception as e:
              print("INEGI_DISCOVERY_UNAVAILABLE",type(e).__name__,str(e)[:120],flush=True)
          PY
      - name: Strict first-party RSS Collector probes, metadata-only and no admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          candidates=[
            ("br_bcb_press","Banco Central do Brasil - Press Releases","https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/notasImprensa?ano=2021","br_bcb","Economy","South America","Brazil","pt",["www.bcb.gov.br","bcb.gov.br"]),
            ("br_bcb_news","Banco Central do Brasil - News","https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/noticias?ano=2024","br_bcb","Economy","South America","Brazil","pt",["www.bcb.gov.br","bcb.gov.br"]),
            ("br_bcb_acts","Banco Central do Brasil - Acts and Communications","https://www.bcb.gov.br/api/feed/app/demaisnormativos/atosecomunicados?ano=2025","br_bcb","Government","South America","Brazil","pt",["www.bcb.gov.br","bcb.gov.br"]),
            ("br_bcb_focus","Banco Central do Brasil - Focus Market Survey","https://www.bcb.gov.br/api/feed/sitebcb/sitefeeds/focus","br_bcb","Economy","South America","Brazil","pt",["www.bcb.gov.br","bcb.gov.br"]),
            ("ecb_mid","ECB MID payment systems and monetary data","https://mid.ecb.europa.eu/rss/mid.xml","eu_ecb","Infrastructure","Europe / Global","","en",["mid.ecb.europa.eu","www.ecb.europa.eu"]),
            ("afdb_news","African Development Bank News","https://www.afdb.org/en/news-and-events/rss","afdb","Economy","Africa","","en",["www.afdb.org"]),
            ("za_sars_news","South African Revenue Service latest news","https://www.sars.gov.za/feed/?post_type=latest_news","za_sars","Government","Africa","South Africa","en",["www.sars.gov.za"]),
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,name,url,origin,cat,region,country,lang,hosts) in enumerate(candidates):
              if i: time.sleep(5)
              s=dict(id=sid,name=name,url=url,adapter="rss",enabled=True,min_interval=3600,
                 access_status="reviewed_public",metadata_only=True,allowed_domains=hosts,
                 article_domains=hosts+[h.removeprefix("www.") for h in hosts if h.startswith("www.")],
                 publisher_origin_id=origin,independence="original",category=cat,region=region,
                 country=country,language=lang,attribution=name,official=True,
                 retention_days=180,stale_after_days=30)
              try:
                  d=Collector(s).collect(); st=d["state"]; reports=d["reports"]
                  recent=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
                  bad=[r for r in reports if not r.get("title") or not r.get("published_at")
                     or not r.get("attribution") or r.get("summary") or r.get("media")
                     or r.get("origin_id")!=origin or r.get("country_basis")!="publisher_coverage"
                     or r.get("latitude") is not None or r.get("longitude") is not None
                     or urlsplit(r.get("url","")).scheme!="https"
                     or urlsplit(r.get("url","")).hostname not in s["article_domains"]]
                  eligible=bool(st.get("status")=="available" and st.get("http_status")==200
                                 and reports and recent and not bad)
                  print("GLOBAL_DIVERSITY_PRE_ADMISSION",json.dumps(dict(
                     id=sid,eligible=eligible,http_status=st.get("http_status"),status=st.get("status"),
                     reports=len(reports),recent_30d=len(recent),latest=st.get("latest_publication"),
                     violations=len(bad),origin=origin,error=str(st.get("error",""))[:150],
                     sample_article_urls=[r.get("url") for r in reports[:2]]),sort_keys=True),flush=True)
              except Exception as e:
                  print("GLOBAL_DIVERSITY_PRE_ADMISSION",json.dumps(dict(id=sid,eligible=False,error=type(e).__name__+":"+str(e)[:150])),flush=True)
          print("NO_SOURCES_ENABLED_BY_PROBE",flush=True)
          PY
