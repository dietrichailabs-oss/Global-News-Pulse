name: Source Expansion - ECB MID Post-Admission Provenance and Live
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-mid-post-admission.yml
      - global_pulse/resources/sources.json
      - tests/test_source_expansion_mid.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mid-post-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Exact-catalog parser, rights and publisher-origin regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_mid.py tests/test_source_expansion_ecb.py tests/test_issue22_publisher_origin_group.py
      - name: Live admitted MID feed recheck
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import load_catalog,Collector,timestamp
          c={s["id"]:s for s in load_catalog()}
          s=c["ecb_mid"]
          assert s["enabled"] and s["metadata_only"] and s["publisher_origin_id"]=="eu_ecb"
          assert c["ecb_press"]["publisher_origin_id"]==c["ecb_statpress"]["publisher_origin_id"]=="eu_ecb"
          assert s["min_interval"]>=3600 and s["license_url"] and s["attribution"]
          d=Collector(s).collect(); st=d["state"]; reports=d["reports"]
          now=datetime.now(timezone.utc).timestamp()
          recent=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
          bad=[r for r in reports if not r.get("title") or not r.get("published_at")
               or not r.get("attribution") or r.get("summary") or r.get("media")
               or r.get("origin_id")!="eu_ecb" or r.get("country_basis")!="publisher_coverage"
               or r.get("latitude") is not None or r.get("longitude") is not None
               or urlsplit(r.get("url","")).scheme!="https"
               or urlsplit(r.get("url","")).hostname not in s["article_domains"]]
          passed=bool(st.get("status")=="available" and st.get("http_status")==200 and reports and recent and not bad)
          print("ECB_MID_POST_ADMISSION",json.dumps(dict(passed=passed,http_status=st.get("http_status"),
              status=st.get("status"),reports=len(reports),recent_30d=len(recent),
              latest=st.get("latest_publication"),origin="eu_ecb",violations=len(bad),
              error=st.get("error","")),sort_keys=True),flush=True)
          if not passed: raise SystemExit("ECB_MID_POST_ADMISSION_FAILED")
          PY
