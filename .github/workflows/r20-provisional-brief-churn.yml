name: R20 empty opening Brief under continuous collection diagnostic
on:
  push:
    branches: [eng/r20-provisional-brief-churn-20261127]
permissions:
  contents: read
jobs:
  churn:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Verify exact product and install locked dependencies
        shell: bash
        run: |
          git diff --exit-code ef413acf0c81e3265df2f535cc9bf35c5ec29dd5 HEAD -- global_pulse requirements-bootstrap.lock requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Actual first collection and automatic Brief publication
        shell: bash
        run: |
          rc=0
          for trial in 1 2; do
            echo "R20_PROVISIONAL_TRIAL=$trial source=ef413acf0c81e3265df2f535cc9bf35c5ec29dd5"
            if python -m pytest -q -s --tb=short tests/test_r20_provisional_brief_churn.py; then
              result=0
            else
              result=$?
            fi
            echo "R20_PROVISIONAL_EXIT=$result trial=$trial"
            if [ "$result" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
