name: Source Expansion - EMA Health Post-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-ema-admission.yml
      - tests/test_source_expansion_ema.py
      - global_pulse/resources/sources.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ema-checked-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline rights, origin and metadata-only parser regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_ema.py tests/test_issue22_publisher_origin_group.py
      - name: Collect live catalog rows with pacing (no rate-limit bypass)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp

          expected = {"ema_news_releases":"https://www.ema.europa.eu/en/news.xml",
                      "ema_whats_new":"https://www.ema.europa.eu/en/whats-new.xml"}
          catalog = {row["id"]: row for row in load_catalog()}
          now = datetime.now(timezone.utc).timestamp()
          failures = []
          for index, (identity, url) in enumerate(expected.items()):
              if index: time.sleep(5)
              row = catalog[identity]
              assert row["url"] == url and row["publisher_origin_id"] == "eu_ema"
              assert row["enabled"] and row["metadata_only"] and row["access_status"] == "reviewed_public"
              assert row["min_interval"] >= 3600 and row["attribution"] and row["license_url"].startswith("https://")
              collected = Collector(row).collect()
              state = collected["state"]; reports = collected["reports"]
              recent = [r for r in reports if r.get("published_at")
                  and 0 <= now-timestamp(r["published_at"]) <= 30*86400]
              violations = [r for r in reports if not r.get("title") or not r.get("published_at")
                  or not r.get("attribution") or r.get("summary") or r.get("media")
                  or r.get("origin_id") != "eu_ema" or r.get("country_basis") != "publisher_coverage"
                  or urlsplit(r.get("url","")).scheme != "https"
                  or urlsplit(r.get("url","")).hostname not in row["article_domains"]]
              success = bool(state.get("status") == "available" and state.get("http_status") == 200
                  and reports and recent and not violations)
              print("EMA_POST_ADMISSION", json.dumps(dict(id=identity, passed=success,
                  status=state.get("status"), http_status=state.get("http_status"),
                  reports=len(reports), recent_30d=len(recent), latest=state.get("latest_publication") or "",
                  origin="eu_ema", violations=len(violations), error=state.get("error") or ""),
                  sort_keys=True), flush=True)
              if not success: failures.append(identity)
          if failures: raise SystemExit("EMA_ADMISSION_FAILED: " + ",".join(failures))
          print("EMA_TWO_FEEDS_POST_ADMISSION_PASS")
          PY
