name: Source Expansion - UK Welfare Environment and Tax Atom Probe
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths: [.github/workflows/source-expansion-uk-dwp-ea-hmrc-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  uk-atom-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONUTF8: '1', PYTHONNOUSERSITE: '1', PIP_NO_INPUT: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install locked dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Existing offline provenance regressions
        run: python -m pytest -q tests/test_source_expansion_open_feeds.py tests/test_issue22_publisher_origin_group.py
      - name: Publisher-direct bounded UK Atom live pre-admission; never enable on probe alone
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          items=[
            ("uk_dwp","department-for-work-pensions","Humanitarian"),
            ("uk_environment_agency","environment-agency","Disaster"),
            ("uk_hmrc","hm-revenue-customs","Economy"),
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,slug,category) in enumerate(items):
            if i:time.sleep(5)
            source=dict(id=sid,name="GOV.UK - "+slug,
              url="https://www.gov.uk/government/organisations/"+slug+".atom",
              adapter="atom",enabled=True,metadata_only=True,category=category,
              region="Europe",country="United Kingdom",official=True,
              official_scope="statement",access_status="reviewed_public",
              publisher_origin_id="uk_government",independence="original",language="en",
              min_interval=3600,stale_after_days=30,retention_days=90,
              allowed_domains=["www.gov.uk"],article_domains=["www.gov.uk"],
              attribution="GOV.UK / "+slug+"; contains public sector information licensed under OGL v3.0; original headline, direct URL and date; no endorsement")
            try:
              out=Collector(source).collect();st=out["state"];rs=out["reports"]
              recent=[r for r in rs if r.get("published_at") and
                0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in rs if not r.get("title") or not r.get("published_at")
                or not r.get("original_url") or r.get("original_url")!=r.get("url")
                or r.get("summary") or r.get("media")
                or r.get("origin_id")!="uk_government"
                or r.get("country_basis")!="publisher_coverage"
                or r.get("latitude") is not None or r.get("longitude") is not None
                or urlsplit(r.get("url","")).scheme!="https"
                or urlsplit(r.get("url","")).hostname!="www.gov.uk"]
              passed=bool(st.get("status")=="available" and st.get("http_status")==200 and rs and recent and not bad)
              row=dict(id=sid,technical_eligible=passed,origin="uk_government",
                status=st.get("status"),http_status=st.get("http_status"),
                reports=len(rs),recent_30d=len(recent),latest=st.get("latest_publication"),
                violations=len(bad),error=st.get("error",""),
                sample_original_urls=[r.get("original_url") for r in rs[:3]])
            except Exception as exc:
              row=dict(id=sid,technical_eligible=False,error=type(exc).__name__+":"+str(exc)[:160])
            print("UK_ATOM_PRE_ADMISSION",json.dumps(row,sort_keys=True),flush=True)
          print("NO_CATALOG_MUTATION_NO_RELEASE",flush=True)
          PY
