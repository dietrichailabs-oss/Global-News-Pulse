name: Source Expansion Live Audit

on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    # Only code/catalog changes trigger an origin-wide live audit.
    # Documentation, probe-only workflows and isolated tests must not cause
    # many unpaced publisher requests or bypass access-denial host holds.
    paths:
      - global_pulse/resources/sources.json
      - global_pulse/sources.py
      - scripts/source_expansion_live_audit.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-expansion-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline source-expansion regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_open_feeds.py
      - name: Live source-expansion admission audit
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_expansion_live_audit.py --consent-network --output source-expansion-live-audit.json
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-expansion-live-audit-${{ github.sha }}
          path: source-expansion-live-audit.json
          if-no-files-found: warn
          retention-days: 1
