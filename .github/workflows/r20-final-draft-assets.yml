name: R20 final launch draft - exact verified assets
on:
  push:
    branches: [release-prep/r20-final-draft-assets-d4ff8fb]
permissions:
  contents: write
  actions: read
concurrency:
  group: r20-final-draft-assets-d4ff8fb
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GP_SOURCE: 'd4ff8fb70b1dc8ae41b14f23ad519ca04450679a'
      RELEASE_TAG: v0.1.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: d4ff8fb70b1dc8ae41b14f23ad519ca04450679a
          persist-credentials: false
      - name: Recover exact held installer portable and source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "dietrichailabs-oss/Global-News-Pulse"
          test "$(git rev-parse HEAD)" = "$GP_SOURCE"
          mkdir -p "$RUNNER_TEMP/release-input" "$RUNNER_TEMP/release-assets"
          cd "$RUNNER_TEMP/release-input"
          while read -r id bytes sha; do
            curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 900 --retry 1 -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" -o "$id.zip"
            test "$(stat -c %s "$id.zip")" = "$bytes"
            printf '%s  %s\n' "$sha" "$id.zip" | sha256sum --check
          done <<'PINS'
          15234589445 619888198 a277bdf1e9a66f80406c09fe9b730e74662e5b37ce02682a0d4e938aef0890f6
          15236645168 604652391 a3652ac8d0383c1c8ce50cc41190094921a889676e755536e75b7f5e9215d62c
          15235714736 23402861 9c51d4a698f892ec165cf814da7ae50839fa76a4c36810a851e25cac2fd42a3e
          15235594840 580360751 96b5cc2527b90e4416218ba8b902a2842b56c07d04a8a6b532c4491b23f503fc
          PINS
          python - <<'PY'
          import hashlib, json, os, shutil, zipfile
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"])
          inp=root/"release-input"
          assets=root/"release-assets"
          source=Path(os.environ["GITHUB_WORKSPACE"])
          def extract_exact(z,name,target,size,sha):
              assert z.namelist().count(name)==1, name
              assert z.getinfo(name).file_size==size, name
              digest=hashlib.sha256()
              with z.open(name) as f, target.open("xb") as out:
                  while block:=f.read(1024*1024):
                      digest.update(block)
                      out.write(block)
              assert target.stat().st_size==size and digest.hexdigest()==sha, name
              print("EXACT_ASSET",target.name,size,sha,flush=True)
          with zipfile.ZipFile(inp/"15234589445.zip") as z:
              for name,size,sha in [
                  ("15230719212-setup.zip",249477497,"5a5e77af18e9dce55d96648e35337212e1209a9710ca0474248f3f7667684df7"),
                  ("15230564346-portable.zip",369997415,"8c7f3fa7c4011c1cb3fd4d0348d7ca8e342daf7eeb530560ff5705121ba6be28"),
                  ("15230589401-receipts.zip",356726,"4a7b5cd21554da8b2e9de7b3f43204c89324edda6dccf0dc14cdc3b965c64b1f")]:
                  target=assets/"R20-verified-build-receipts.zip" if "receipts" in name else inp/name
                  extract_exact(z,name,target,size,sha)
          setup="GlobalPulse-0.1.1-E2-windows-x64-setup.zip"
          portable="GlobalPulse-0.1.1-E2-windows-x64-portable.zip"
          with zipfile.ZipFile(inp/"15230719212-setup.zip") as z:
              assert z.namelist()==[setup]
              extract_exact(z,setup,assets/setup,249401379,"1aa86a2fae2a5b90e3344ac7a122adbb030da09b9db9423e218f473c1c6876bc")
          with zipfile.ZipFile(assets/setup) as z:
              exe="GlobalPulse-0.1.1-E2-windows-x64-setup.exe"
              assert z.namelist()==[exe]
              assert z.getinfo(exe).file_size==250093699
              with z.open(exe) as f:
                  assert hashlib.file_digest(f,"sha256").hexdigest()=="d3d07db8479b8ffcb458e3ed600499331c76259d1519578f9a9107157b3e773f"
          with zipfile.ZipFile(inp/"15230564346-portable.zip") as z:
              assert z.namelist()==[portable]
              extract_exact(z,portable,assets/portable,372560538,"b279a7f93f1d7e5340167a731a339b3afbeeb9821c01bcec504a65e1b7b7b47f")
          pin=source/"packaging/licenses/QT-6.12.0-OPEN-SOURCE-COMPLIANCE.json"
          pins=json.loads(pin.read_text(encoding="utf-8"))["exact_source_archives"]
          for id,row in zip([15236645168,15235714736,15235594840],pins,strict=True):
              with zipfile.ZipFile(inp/f"{id}.zip") as z:
                  name=row["url"].rsplit("/",1)[-1]
                  assert z.read(pin.name)==pin.read_bytes()
                  extract_exact(z,name,assets/name,row["bytes"],row["sha256"])
          shutil.copy2(pin,assets/pin.name)
          shutil.copy2(source/"packaging/licenses/qt-webengine-pdf/SOURCE-AND-REPLACEMENT.md",assets/"SOURCE-AND-REPLACEMENT.md")
          for name in ("Qt-LGPL-3.0-only.txt","Qt-GPL-3.0-only.txt"):
              shutil.copy2(source/"packaging/licenses"/name,assets/name)
          info={"product":"Global Pulse 0.1.1 / E2","source_commit":os.environ["GP_SOURCE"],
                "original_build_run":46064298575,"original_package_workflow_commit":"776b9b874f3beddc8ae3bb700e54a0e0b91dc537",
                "custody_artifact":15234589445,"source_staging_run":46079156004,
                "signed":False,"scope":"Draft launch preparation and controlled provider demonstrations only. No public distribution or final rights clearance established.",
                "source_offer_status":"Three exact pinned upstream archives staged; verify durable public equivalent no-charge access, notices and corresponding-source completeness before binary publication."}
          (assets/"RELEASE_PROVENANCE.json").write_text(json.dumps(info,indent=2)+"\n",encoding="utf-8")
          (assets/"PROVIDER_DEMO_GUIDE.md").write_text("""# Global Pulse 0.1.1 / E2 — controlled provider demonstration

Use the exact verified setup or complete portable ZIP. Verify SHA256SUMS.txt before running. The installer is unsigned; do not bypass Windows security. Run as a normal Windows user, back up existing archive/exports and use a separate demonstration profile.

For an initial non-network walkthrough: start with monitoring paused using `GlobalPulse.exe --data-dir PATH_TO_NEW_DEMO_PROFILE --no-start`. Demonstrate the map and source controls, collection/paused status, local Daily and Weekly Brief generation, report navigation, attribution, original-source links and full exit. An empty profile honestly shows no available reports. Do not use synthetic data as live evidence.

For a provider-specific live demonstration, confirm the agreed test scope and use the provider's actual permitted route only. Show the source name, original URL, relevant timestamps, attribution, and consent/stop controls. Demonstrate export or embedded viewing only where the provider has agreed to that operation. Do not represent an ordinary player page, successful HTTP response or owner approval as a grant of redistribution rights. Do not publish copied provider content or send user archive data. Record which provider, exact build hash, tested route, observed behavior and any conditions/approval separately. If a particular operation is not permitted, show the normal original provider link instead.

This guide records no completed provider demonstration or third-party permission. The draft package retains all existing integrations; release review must resolve any outstanding conditions. 
""",encoding="utf-8")
          lines=[]
          for f in sorted(assets.iterdir()):
              with f.open("rb") as stream:
                  lines.append(f"{hashlib.file_digest(stream,'sha256').hexdigest()}  {f.name}")
          (assets/"SHA256SUMS.txt").write_text("\n".join(lines)+"\n",encoding="utf-8")
          print("STAGED_ASSET_COUNT",len(list(assets.iterdir())),flush=True)
          PY
      - name: Prepare accurate draft release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/RELEASE_NOTES.md" <<'NOTES'
          # Global Pulse 0.1.1 / E2

          **DRAFT — final launch preparation / controlled provider demonstrations. Not yet publicly released.**

          Global Pulse is a free Windows desktop workstation for monitoring publicly available news and event metadata, reviewing source-linked evidence on a world map and preparing dated Daily and Weekly intelligence briefs.

          - Local archive, map and feed, filtering, saved situations and notification history.
          - Automatic initial Daily Brief recovery, independent Generate and safe retry/close handling.
          - Paginated previews and complete source-linked Markdown and HTML report exports.
          - Internet radio, curated WebSDR links, landscape snapshots and separately consented camera choices. Provider availability and permitted uses vary. YouTube and KiwiSDR integrations are not included.

          Exact tested source: `d4ff8fb70b1dc8ae41b14f23ad519ca04450679a`. The installer and portable ZIP are the previously verified original bytes from run 46064298575, not a new compilation. Automated results: 2,412 passed, 10 subtests passed, 14 existing historical deselections, eight offline lifecycle checks. Independent QA verified 3,360 runtime files without mismatch. Physical test scope, remaining intermittent interface pauses, provider-specific permissions and runtime security/licensing disposition are not represented as universally cleared.

          ### Installation
          Verify SHA256SUMS.txt, extract the setup ZIP and run its sole EXE, or extract the complete portable ZIP and keep its runtime directories together. Use a normal Windows account. Back up your closed application archive and exports first. E2 schema 2 requires a separate compatible backup for rollback. Live camera helper requires Edge WebView2 Runtime. The package is unsigned; do not bypass Windows security. Use **Exit Completely** in the tray to stop.

          ### Source and rights
          Three exact Qt/PySide/WebEngine-PDF source archives and source/replacement notices are staged alongside the binaries. Public equivalent no-charge access, required notices and corresponding-source completeness must be confirmed before publication. Dependency licenses do not select the application's own license. Application-license selection and remaining provider/runtime rights conditions must be recorded before publication. No endorsement or worldwide coverage guarantee.

          ### Provider demonstration
          Use PROVIDER_DEMO_GUIDE.md and the agreed provider-specific test scope. Do not use this draft as evidence of permission for every provider or operation.
          NOTES
      - name: Create only a new unpublished draft release at exact tested source
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name=="v0.1.1") | .id')"
          test -z "$existing" || { echo 'A v0.1.1 release already exists; refusing to overwrite it.'; exit 1; }
          # No public release, branch merge, signing or new product build.
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP"/release-assets/* --repo "$GITHUB_REPOSITORY" --target "$GP_SOURCE" --draft --title 'Global Pulse 0.1.1 / E2' --notes-file "$RUNNER_TEMP/RELEASE_NOTES.md"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,targetCommitish,url > "$RUNNER_TEMP/DRAFT_RELEASE.json"
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads((Path(os.environ["RUNNER_TEMP"])/"DRAFT_RELEASE.json").read_text())
          assert r["isDraft"] is True and r["tagName"]==os.environ["RELEASE_TAG"] and r["targetCommitish"]==os.environ["GP_SOURCE"],r
          print("DRAFT_RELEASE_VERIFIED="+json.dumps(r,sort_keys=True),flush=True)
          PY
      - name: Read back every draft release asset and compare exact hashes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-readback"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --dir "$RUNNER_TEMP/release-readback"
          cmp "$RUNNER_TEMP/release-assets/SHA256SUMS.txt" "$RUNNER_TEMP/release-readback/SHA256SUMS.txt"
          cd "$RUNNER_TEMP/release-readback"
          sha256sum --check SHA256SUMS.txt
          diff <(cd "$RUNNER_TEMP/release-assets"; ls -1 | sort) <(ls -1 | sort)
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')" = true
          echo 'DRAFT_RELEASE_ASSETS_READBACK_PASS; publication remains disabled.'
