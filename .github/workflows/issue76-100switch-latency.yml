name: Issue76 100-Cycle Real Qt Tab Latency Engineering Probe

on:
  push:
    branches: [eng/issue76-100switch-latency-diagnostic-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue76-100-switch-latency
  cancel-in-progress: true

jobs:
  tab-latency:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm exact PR77 source and only diagnostic paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b885ee98c80a280fede535903301871b9ebf1199 HEAD
          git diff --name-only b885ee98c80a280fede535903301871b9ebf1199..HEAD | python -c "import sys; expected={'tests/test_issue76_100_tab_latency.py','.github/workflows/issue76-100switch-latency.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Use actual Windows Qt platform
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Run 100-cycle real Qt/SQLite navigation test, preserve native exit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -s -q --tb=short tests/test_issue76_100_tab_latency.py
      - name: Confirm no generated product edits
        if: always()
        shell: bash
        run: git diff --exit-code
