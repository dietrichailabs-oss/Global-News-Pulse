name: Issue82 Native TV Codec and Virtual Economy QA

on:
  push:
    branches: [eng/issue82-owner-tab-render-video-20261115]
    paths:
      - 'global_pulse/ui.py'
      - 'global_pulse/__main__.py'
      - 'global_pulse/single_media.py'
      - 'global_pulse/native_tv.py'
      - 'tests/test_issue82_owner_tab_paint_cpu.py'
      - 'tests/test_issue82_startup_video_diagnostics.py'
      - 'tests/test_issue82_native_tv_policy.py'
      - 'packaging/tv/**'
      - 'scripts/build_windows.ps1'
      - 'scripts/collect_dotnet_notices.py'
      - 'tests/test_dotnet_notices.py'
      - '.github/workflows/issue82-native-v2-qa.yml'
  workflow_dispatch:
  pull_request:
    branches: [eng/issue82-owner-optin-sources-tab-responsiveness-20261115]
    paths:
      - '.github/workflows/issue82-native-v2-qa.yml'
      - 'global_pulse/ui.py'
      - 'global_pulse/__main__.py'
      - 'global_pulse/single_media.py'
      - 'global_pulse/native_tv.py'
      - 'packaging/tv/**'
      - 'tests/test_issue82_owner_tab_paint_cpu.py'
      - 'tests/test_issue82_startup_video_diagnostics.py'
      - 'tests/test_issue82_native_tv_policy.py'
      - 'scripts/collect_dotnet_notices.py'
      - 'tests/test_dotnet_notices.py'

permissions:
  contents: read

concurrency:
  group: issue82-native-tv-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.403'
      - name: Install source-locked Python test dependencies
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed' }
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python build dependencies failed' }
      - name: Run exact owner tab and video policy regressions
        run: |
          $ErrorActionPreference='Stop'
          python -m pytest -q tests/test_issue82_owner_tab_paint_cpu.py tests/test_issue82_native_tv_policy.py tests/test_dotnet_notices.py tests/test_issue82_startup_video_diagnostics.py tests/test_issue82_owner_win11_optin_sources_tabs.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_ui_desktop.py
          if ($LASTEXITCODE -ne 0) { throw 'Desktop and TV source QA failed' }
      - name: Restore exact locked Microsoft native WebView2 SDK
        run: |
          $ErrorActionPreference='Stop'
          dotnet restore packaging/tv/GlobalPulse.TV.csproj --runtime win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 restore failed' }
      - name: Compile native WebView2 host and probe offline HTML5 decoder
        run: |
          $ErrorActionPreference='Stop'
          $output=Join-Path $env:RUNNER_TEMP 'globalpulse-tv-native-probe'
          dotnet publish packaging/tv/GlobalPulse.TV.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output $output -p:PublishSingleFile=false -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw 'Native TV build failed' }
          $exe=Join-Path $output 'GlobalPulse.TV.exe'
          $receipt=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_CODEC_PROBE.jsonl'
          $stderr=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_CODEC_STDERR.txt'
          $process=Start-Process -FilePath $exe -ArgumentList '--probe' -PassThru -RedirectStandardOutput $receipt -RedirectStandardError $stderr
          if (-not $process.WaitForExit(45000)) {
            $process.Kill()
            throw 'Offline native TV probe timed out'
          }
          if ($process.ExitCode -ne 0) { throw ('Offline native TV probe failed: ' + $process.ExitCode + ', stderr: ' + (Get-Content $stderr -Raw)) }
          $messages=@(Get-Content -LiteralPath $receipt | Where-Object { $_.Trim() })
          $codec=@($messages | ConvertFrom-Json | Where-Object { $_.type -eq 'codec_probe' })
          if ($codec.Count -ne 1 -or $codec[0].h264 -notin @('probably','maybe') -or $codec[0].in_private -ne $true -or $codec[0].network -ne 'none') {
            throw 'No successful offline WebView2 H.264+InPrivate capability receipt'
          }
          Get-Content -LiteralPath $receipt
      - name: Verify exact shipped Microsoft SDK notice provenance after native publish
        run: |
          $ErrorActionPreference='Stop'
          $deps=Join-Path $env:RUNNER_TEMP 'globalpulse-tv-native-probe/GlobalPulse.TV.deps.json'
          $nuget=Join-Path $env:USERPROFILE '.nuget/packages'
          $output=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_NOTICES'
          $sdk=Join-Path $nuget 'microsoft.web.webview2/1.0.4314.35'
          Write-Host ('NUGET_SDK_CACHE_EXISTS=' + (Test-Path -LiteralPath $sdk))
          if (Test-Path -LiteralPath $sdk) {
            Get-ChildItem -LiteralPath $sdk -File | Where-Object { $_.Name -like '*.sha512' -or $_.Name -like '*.nupkg' -or $_.Name -match '(?i)license|notice' } |
              ForEach-Object {
                Write-Host ('SDK_CACHE_FILE=' + $_.Name + ';bytes=' + $_.Length)
                if ($_.Name -like '*.sha512') { Write-Host ('SDK_CACHE_HASH_VALUE=' + (Get-Content -LiteralPath $_.FullName -Raw).Trim()) }
              }
          }
          $lock=Get-Content -LiteralPath 'packaging/tv/packages.lock.json' -Raw | ConvertFrom-Json
          $expectedNuget='x5MFf2W03xueU1mMNvivXfHSsQ+ODo7vJ36qw/dLtU5Gs+8d7+7N7zzmNNDoT3ffosmcvZNBtUnlzyiDUuBkSQ=='
          $expectedArchive='cOaiVqP3BmQHMnxGpZzANM22tUXgycrisyJHjIGNzIaMsm8iXj7Kx+ceYg+RbYwJtzT009qfcFTocvVLY+ekMw=='
          $locked=$lock.dependencies.'net10.0-windows10.0.19041/win-x64'.'Microsoft.Web.WebView2'.contentHash
          Write-Host ('SDK_NUGET_LOCK_CONTENT_SHA512=' + $locked)
          $metadata=Get-Content -LiteralPath (Join-Path $sdk '.nupkg.metadata') -Raw | ConvertFrom-Json
          Write-Host ('SDK_NUGET_CACHE_CONTENT_SHA512=' + $metadata.contentHash)
          Write-Host ('SDK_NUGET_CACHE_SOURCE=' + $metadata.source)
          if ($locked -ne $expectedNuget -or $metadata.contentHash -ne $expectedNuget -or
              -not $metadata.source.StartsWith('https://api.nuget.org/v3/')) {
            throw 'NuGet semantic package content and reviewed lock provenance differ'
          }
          $archive=Join-Path $sdk 'microsoft.web.webview2.1.0.4314.35.nupkg'
          $stream=[System.IO.File]::OpenRead($archive)
          try { $archiveHash=[Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData($stream)) }
          finally { $stream.Dispose() }
          Write-Host ('SDK_ARCHIVE_SHA512=' + $archiveHash)
          $upstream='https://api.nuget.org/v3-flatcontainer/microsoft.web.webview2/1.0.4314.35/microsoft.web.webview2.1.0.4314.35.nupkg'
          $upstreamArchive=Join-Path $env:RUNNER_TEMP 'Microsoft.Web.WebView2.upstream.nupkg'
          Invoke-WebRequest -Uri $upstream -OutFile $upstreamArchive -TimeoutSec 90
          $officialStream=[System.IO.File]::OpenRead($upstreamArchive)
          try { $upstreamHash=[Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData($officialStream)) }
          finally { $officialStream.Dispose() }
          Write-Host ('SDK_OFFICIAL_NUGET_SHA512=' + $upstreamHash)
          Write-Host ('SDK_OFFICIAL_NUGET_BYTES=' + (Get-Item -LiteralPath $upstreamArchive).Length)
          if ($archiveHash -ne $expectedArchive -or $upstreamHash -ne $expectedArchive -or
              (Get-Content -LiteralPath (Join-Path $sdk 'microsoft.web.webview2.1.0.4314.35.nupkg.sha512') -Raw).Trim() -ne $expectedArchive) {
            throw 'Reviewed signed WebView2 SDK archive does not match official NuGet bytes'
          }
          python scripts/collect_dotnet_notices.py --deps $deps --nuget-root $nuget --output $output
          if ($LASTEXITCODE -ne 0) { throw 'Native WebView2 notice provenance failed closed' }
          $receipt=Get-Content -LiteralPath (Join-Path $output 'NATIVE_PACKAGE_NOTICES.json') -Raw | ConvertFrom-Json
          $refs=@($receipt.packages | Where-Object { $_.type -eq 'reference' -and $_.package -like 'Microsoft.Web.WebView2.*' })
          if ($refs.Count -eq 0) { throw 'No WebView2 assembly reference notice was accounted' }
          foreach($item in $refs) {
            if ($item.notice_source_package -ne 'Microsoft.Web.WebView2/1.0.4314.35' -or
                $item.notice_source_lock_sha512 -ne $expectedNuget -or
                $item.notice_source_archive_sha512 -ne $expectedArchive -or
                @($item.notice_files).Count -eq 0 -or
                $item.evidence_kind -ne 'package_notice_text') {
              throw 'WebView2 assembly reference notice has no exact SDK/license/hash proof'
            }
          }
          Write-Host "NATIVE_SDK_REFERENCE_NOTICES_VERIFIED=$($refs.Count)"
      - name: Run compiled network-free native browser policy cases
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'globalpulse-tv-native-probe/GlobalPulse.TV.exe'
          $receipt=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_POLICY_SELF_TEST.jsonl'
          $stderr=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_POLICY_STDERR.txt'
          $process=Start-Process -FilePath $exe -ArgumentList '--self-test-policy' -PassThru -RedirectStandardOutput $receipt -RedirectStandardError $stderr
          if (-not $process.WaitForExit(15000)) {
            $process.Kill()
            throw 'Native browser policy test timed out'
          }
          if ($process.ExitCode -ne 0) { throw ('Native policy test failed: ' + $process.ExitCode + ', stderr: ' + (Get-Content $stderr -Raw)) }
          $messages=@(Get-Content -LiteralPath $receipt | Where-Object { $_.Trim() })
          $checks=@($messages | ConvertFrom-Json | Where-Object { $_.type -eq 'policy_self_test' })
          if ($checks.Count -ne 1 -or $checks[0].passed -ne $true -or $checks[0].cases -lt 31 -or $checks[0].failures -ne 0 -or $checks[0].network -ne 'none') {
            throw 'Native browser policy self-test did not pass all network-free cases'
          }
          Get-Content -LiteralPath $receipt
      - name: Reject inherited WebView2 debug and data-folder overrides
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:RUNNER_TEMP 'globalpulse-tv-native-probe/GlobalPulse.TV.exe'
          $receipt=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_OVERRIDE_REFUSAL.jsonl'
          $stderr=Join-Path $env:RUNNER_TEMP 'ISSUE82_NATIVE_TV_OVERRIDE_STDERR.txt'
          $forbidden=Join-Path $env:RUNNER_TEMP 'ISSUE82_FORBIDDEN_WEBVIEW2_PROFILE'
          $env:WEBVIEW2_USER_DATA_FOLDER=$forbidden
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS='--disable-web-security'
          try {
            $process=Start-Process -FilePath $exe -ArgumentList '--probe' -PassThru -RedirectStandardOutput $receipt -RedirectStandardError $stderr
            if (-not $process.WaitForExit(15000)) { $process.Kill(); throw 'Unsafe-override refusal timed out' }
          }
          finally {
            Remove-Item Env:WEBVIEW2_USER_DATA_FOLDER -ErrorAction SilentlyContinue
            Remove-Item Env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS -ErrorAction SilentlyContinue
          }
          $lines=@(Get-Content -LiteralPath $receipt | Where-Object { $_.Trim() })
          $messages=@($lines | ConvertFrom-Json)
          if (@($messages | Where-Object { $_.type -eq 'codec_probe' }).Count -ne 0 -or
              @($messages | Where-Object { $_.type -eq 'error' -and $_.reason -eq 'startup_InvalidOperationException' }).Count -ne 1 -or
              (Test-Path -LiteralPath $forbidden)) {
            throw 'WebView2 override was not refused before profile creation'
          }
          Get-Content -LiteralPath $receipt
      - name: Preserve prototype QA receipts and dependency lock (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue82-v2-native-codec-qa
          path: |
            packaging/tv/packages.lock.json
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_NOTICES/NATIVE_PACKAGE_NOTICES.json
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_CODEC_PROBE.jsonl
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_CODEC_STDERR.txt
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_POLICY_SELF_TEST.jsonl
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_POLICY_STDERR.txt
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_OVERRIDE_REFUSAL.jsonl
            ${{ runner.temp }}/ISSUE82_NATIVE_TV_OVERRIDE_STDERR.txt
          retention-days: 7
          if-no-files-found: warn
