name: Issue82 Windows Tab Responsiveness, Radio and Package QA

on:
  push:
    branches: [eng/issue82-owner-tab-render-video-20261115]
    paths:
      - 'global_pulse/core.py'
      - 'global_pulse/ui.py'
      - 'global_pulse/__main__.py'
      - 'global_pulse/single_media.py'
      - 'global_pulse/media_widget.py'
      - 'global_pulse/internet_radio.py'
      - 'tests/test_issue82_owner_tab_paint_cpu.py'
      - 'tests/test_issue82_startup_video_diagnostics.py'
      - 'scripts/build_windows.ps1'
      - 'scripts/collect_dotnet_notices.py'
      - 'tests/test_dotnet_notices.py'
      - 'tests/test_tv_package_manifest_gate.py'
      - 'tests/test_youtube_removal.py'
      - 'tests/test_packaging.py'
      - 'scripts/package_manifest.py'
      - '.github/workflows/issue82-native-v2-qa.yml'
  workflow_dispatch:
  pull_request:
    branches: [eng/issue82-owner-optin-sources-tab-responsiveness-20261115]
    paths:
      - '.github/workflows/issue82-native-v2-qa.yml'
      - 'global_pulse/core.py'
      - 'global_pulse/ui.py'
      - 'global_pulse/__main__.py'
      - 'global_pulse/single_media.py'
      - 'global_pulse/media_widget.py'
      - 'global_pulse/internet_radio.py'
      - 'tests/test_issue82_owner_tab_paint_cpu.py'
      - 'tests/test_issue82_startup_video_diagnostics.py'
      - 'scripts/collect_dotnet_notices.py'
      - 'tests/test_dotnet_notices.py'
      - 'tests/test_tv_package_manifest_gate.py'
      - 'tests/test_youtube_removal.py'
      - 'tests/test_packaging.py'
      - 'scripts/package_manifest.py'

permissions:
  contents: read

concurrency:
  group: issue82-windows-regression-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: windows
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install source-locked Python test dependencies
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-bootstrap.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python bootstrap failed' }
          python -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock
          if ($LASTEXITCODE -ne 0) { throw 'Python build dependencies failed' }
      - name: Run exact owner tab, radio and package retirement regressions
        run: |
          $ErrorActionPreference='Stop'
          # Fast first-stage diagnostic: expose real map/SQLite heartbeat phases
          # without waiting for 100+ unrelated tests after a performance STOP.
          python -m pytest -q -s tests/test_issue82_owner_tab_paint_cpu.py::test_actual_collector_revision_overlapping_120_tab_clicks --junitxml "$env:RUNNER_TEMP/ISSUE82_COLLECTOR_UI_HEARTBEAT.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Real collector/UI heartbeat performance STOP' }
          python -m pytest -q tests/test_issue82_owner_tab_paint_cpu.py tests/test_youtube_removal.py tests/test_dotnet_notices.py tests/test_tv_package_manifest_gate.py tests/test_packaging.py tests/test_issue82_startup_video_diagnostics.py tests/test_issue82_owner_win11_optin_sources_tabs.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_ui_desktop.py --junitxml "$env:RUNNER_TEMP/ISSUE82_WINDOWS_REGRESSIONS.xml"
          if ($LASTEXITCODE -ne 0) { throw 'Desktop, radio and package retirement QA failed' }
      - name: Preserve Windows regression receipts (not a release)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue82-v2-windows-regression-qa
          path: |
            ${{ runner.temp }}/ISSUE82_COLLECTOR_UI_HEARTBEAT.xml
            ${{ runner.temp }}/ISSUE82_WINDOWS_REGRESSIONS.xml
          retention-days: 7
          if-no-files-found: warn
