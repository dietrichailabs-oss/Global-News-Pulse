name: R20 separate provider demo and frozen clean installer
on:
  push:
    branches: [eng/r20-provider-demo-package-d4ff8fb-20261127]
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      GP_SOURCE: 'd4ff8fb70b1dc8ae41b14f23ad519ca04450679a'
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          architecture: x64
      - name: Freeze original application source and recover verified bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REPOSITORY -ne 'dietrichailabs-oss/Global-News-Pulse') { throw 'Wrong repository' }
          git diff --exit-code $env:GP_SOURCE HEAD -- global_pulse tests requirements-bootstrap.lock requirements-build.lock scripts/build_windows.ps1 packaging/GlobalPulse.iss packaging/GlobalPulse.spec
          if ($LASTEXITCODE -ne 0) { throw 'Product source or original build inputs changed' }
          $zip = Join-Path $env:RUNNER_TEMP 'original-held-custody.zip'
          & curl.exe --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 30 --max-time 900 --retry 1 -H "Authorization: Bearer $env:GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/15234589445/zip" -o $zip
          if ($LASTEXITCODE -ne 0) { throw 'Original held custody download failed' }
          $work = Join-Path $env:RUNNER_TEMP 'gp-demo-pair'
          "GP_WORK=$work" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          python -m scripts.qa_r20_prepare_provider_demo --custody $zip --work $work
          if ($LASTEXITCODE -ne 0) { throw 'Exact original byte verification failed' }
      - name: Preserve unchanged clean installer EXE separately
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-CLEAN-HELD-EXE-d4ff8fb
          path: ${{ env.GP_WORK }}/clean/GlobalPulse-0.1.1-E2-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Prepare reviewed Inno compiler
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $setup -TimeoutSec 120
          if ((Get-Item -LiteralPath $setup).Length -ne 10604576) { throw 'Inno installer size mismatch' }
          if ((Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw 'Inno installer hash mismatch' }
          if ((Get-AuthenticodeSignature -LiteralPath $setup).Status -ne 'Valid') { throw 'Inno signature invalid' }
          $inno = Join-Path $env:RUNNER_TEMP 'gp-inno-6.7.4'
          $p = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-','/CURRENTUSER',('/DIR="' + $inno + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Inno installation failed' }
          "GP_INNO=$(Join-Path $inno 'ISCC.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile only separate demonstration installer wrapper
        run: |
          $ErrorActionPreference = 'Stop'
          $runtime = Join-Path $env:GP_WORK 'GlobalPulse'
          $seed = Join-Path $env:GP_WORK 'seed'
          $output = Join-Path $env:GP_WORK 'demo'
          & $env:GP_INNO '/Qp' "/DPackageRoot=$runtime" "/DSeedRoot=$seed" "/DOutputRoot=$output" 'packaging\GlobalPulse.ProviderDemo.iss'
          if ($LASTEXITCODE -ne 0) { throw 'Demo installer wrapper build failed' }
      - name: Verify actual installed payload, paused shortcut, empty profile and lifecycle
        run: |
          $ErrorActionPreference = 'Stop'
          python -m scripts.qa_r20_provider_demo_smoke --work $env:GP_WORK
          if ($LASTEXITCODE -ne 0) { throw 'Demo-specific installed smoke failed' }
      - name: Retain separate provider demonstration EXE
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-PROVIDER-DEMO-HELD-EXE-d4ff8fb
          path: ${{ env.GP_WORK }}/demo/GlobalPulse-0.1.1-E2-ProviderDemo-windows-x64-setup.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Retain demo guide, exact identities and test receipts separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GlobalPulse-DEMO-PAIR-RECEIPTS-d4ff8fb
          path: |
            ${{ env.GP_WORK }}/PREPARATION.json
            ${{ env.GP_WORK }}/DEMO_PACKAGE_RECEIPT.json
            ${{ env.GP_WORK }}/seed/PROVIDER_DEMO_GUIDE.txt
            ${{ env.GP_WORK }}/smoke/
          if-no-files-found: ignore
          retention-days: 30
