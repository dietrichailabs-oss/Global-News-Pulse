name: Source Expansion - Australia DSS and DTA Pre-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-au-dss-dta-pre-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-feed-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline provenance and publisher grouping baseline
        shell: bash
        run: |
          python -m pytest -q tests/test_source_expansion_open_feeds.py tests/test_issue22_publisher_origin_group.py
      - name: Probe official HTTPS RSS without catalog mutation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          candidates=[
            ("au_dss_updates","au_dss","https://www.dss.gov.au/rss/updates.xml","www.dss.gov.au","Humanitarian"),
            ("au_dss_resources","au_dss","https://www.dss.gov.au/rss/resources.xml","www.dss.gov.au","Government"),
            ("au_dta_news","au_dta","https://www.dta.gov.au/news-and-blogs/latest/feed/news_item","www.dta.gov.au","Infrastructure"),
            ("au_dta_all","au_dta","https://www.dta.gov.au/news-and-blogs/latest/feed/all","www.dta.gov.au","Infrastructure"),
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,origin,url,host,category) in enumerate(candidates):
            if i:time.sleep(3)
            source=dict(id=sid,name=sid,url=url,adapter="rss",enabled=True,metadata_only=True,
              category=category,region="Oceania",country="Australia",official=True,
              official_scope="statement",access_status="reviewed_public",independence="original",
              publisher_origin_id=origin,min_interval=3600,stale_after_days=30,
              retention_days=90,authentication="None",allowed_domains=[host],
              article_domains=[host,host.removeprefix("www.")],language="en",
              attribution=("Australian Department of Social Services" if origin=="au_dss"
                else "Australian Digital Transformation Agency")+"; publisher title, date and original link; no endorsement")
            try:
              out=Collector(source).collect();st=out["state"];rs=out["reports"]
              fresh=[r for r in rs if r.get("published_at") and
                0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in rs if not r.get("title") or not r.get("published_at")
                or not r.get("original_url") or r.get("url")!=r.get("original_url")
                or r.get("summary") or r.get("media")
                or r.get("origin_id")!=origin or r.get("attribution")!=source["attribution"]
                or r.get("country_basis")!="publisher_coverage"
                or r.get("latitude") is not None or r.get("longitude") is not None
                or urlsplit(r.get("url","")).scheme!="https"
                or urlsplit(r.get("url","")).hostname not in source["article_domains"]]
              passed=bool(st.get("status")=="available" and st.get("http_status")==200
                and rs and fresh and not bad)
              data=dict(id=sid,origin=origin,technical_eligible=passed,
                status=st.get("status"),http_status=st.get("http_status"),
                reports=len(rs),recent_30d=len(fresh),latest=st.get("latest_publication"),
                invalid=len(bad),error=st.get("error",""),
                sample_urls=[r.get("original_url") for r in rs[:3]])
            except Exception as exc:
              data=dict(id=sid,origin=origin,technical_eligible=False,
                error=type(exc).__name__+":"+str(exc)[:200])
            print("AU_DSS_DTA_PRE_ADMISSION",json.dumps(data,sort_keys=True),flush=True)
          print("NO_CATALOG_MODIFICATION; independent rights, reliability and post-admission gates required",flush=True)
          PY
