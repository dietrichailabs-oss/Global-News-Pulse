name: Issue58 Map Repaint and Clustering Performance CI

on:
  push:
    branches: [eng/issue58-map-paint-frame-cache-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue58-map-render-perf-ci
  cancel-in-progress: true

jobs:
  verify-map-performance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify frozen PR57 ancestor and three-path scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9346c3e90b9542308d61aa15a9783cf74380a197 HEAD
          git diff --name-only 9346c3e90b9542308d61aa15a9783cf74380a197..HEAD | python -c "import sys; expected={'global_pulse/map_widget.py','tests/test_issue58_map_paint_cache.py','.github/workflows/issue58-map-perf-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Map geometry, source categories and interaction regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue58_map_paint_cache.py tests/test_owner_night_stability_map.py tests/test_issue22_map_pipeline.py tests/test_issue22_country_only_retest.py tests/test_issue22_situation_stars.py
      - name: Verify no test tracked tree mutations
        if: always()
        shell: bash
        run: git diff --exit-code
