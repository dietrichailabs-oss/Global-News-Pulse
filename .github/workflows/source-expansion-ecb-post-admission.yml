name: Source Expansion - ECB Post-Admission Provenance and Live
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-ecb-post-admission.yml
      - global_pulse/resources/sources.json
      - tests/test_source_expansion_ecb.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ecb-catalog-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline exact-source provenance parser and rights regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_ecb.py tests/test_issue22_publisher_origin_group.py
      - name: Recheck both admitted feeds directly using checked-out catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, time
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import load_catalog, Collector, timestamp
          
          expected = {
              "ecb_press": "https://www.ecb.europa.eu/rss/press.html",
              "ecb_statpress": "https://www.ecb.europa.eu/rss/statpress.html",
          }
          catalog = {row["id"]: row for row in load_catalog()}
          now = datetime.now(timezone.utc).timestamp()
          failed=[]
          for i,(identity,url) in enumerate(expected.items()):
              if i: time.sleep(5)
              source=catalog[identity]
              assert source["url"]==url and source["publisher_origin_id"]=="eu_ecb"
              assert source["enabled"] and source["metadata_only"] and source["access_status"]=="reviewed_public"
              assert source["min_interval"]>=3600 and source["license_url"] and source["attribution"]
              observed=Collector(source).collect()
              state=observed["state"]; reports=observed["reports"]
              recent=[r for r in reports if r.get("published_at")
                  and 0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in reports if not r.get("title") or not r.get("published_at")
                  or not r.get("attribution") or r.get("summary") or r.get("media")
                  or r.get("origin_id")!="eu_ecb" or r.get("country_basis")!="publisher_coverage"
                  or r.get("latitude") is not None or r.get("longitude") is not None
                  or urlsplit(r.get("url","")).scheme!="https"
                  or urlsplit(r.get("url","")).hostname not in source["article_domains"]]
              passed=bool(state.get("status")=="available" and state.get("http_status")==200
                  and reports and recent and not bad)
              print("ECB_CATALOG_POST_ADMISSION",json.dumps(dict(
                  id=identity,passed=passed,status=state.get("status"),http_status=state.get("http_status"),
                  reports=len(reports),recent_30d=len(recent),latest=state.get("latest_publication"),
                  origin=source["publisher_origin_id"],violations=len(bad),error=state.get("error") or ""),
                  sort_keys=True),flush=True)
              if not passed: failed.append(identity)
          if failed: raise SystemExit("ECB_CATALOG_ADMISSION_FAILED:"+",".join(failed))
          print("ECB_TWO_FEEDS_POST_ADMISSION_PASS",flush=True)
          
          PY
