name: Source Expansion - Germany and France Admission Probe
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-de-fr-probe.yml
      - tests/test_source_expansion_de_fr.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-candidate-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline parser and provenance regression for admitted Germany/France sources
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_de_fr.py
      - name: Confirm publisher-direct admission against the checked-out catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector, load_catalog, timestamp

          base = {
              "adapter": "rss", "enabled": True, "metadata_only": True,
              "access_status": "reviewed_public", "independence": "original",
              "official": True, "min_interval": 1800,
              "stale_after_days": 21,
          }
          candidates = [
              {
                  **base,
                  "id": "destatis_press",
                  "name": "Germany Federal Statistical Office (Destatis) - Press Releases",
                  "url": "https://www.destatis.de/SiteGlobals/Functions/RSSFeed/DE/RSSNewsfeed/Aktuell.xml?nn=241288",
                  "allowed_domains": ["www.destatis.de"],
                  "article_domains": ["www.destatis.de", "destatis.de"],
                  "publisher_origin_id": "destatis", "category": "Economy",
                  "country": "Germany", "region": "Europe", "language": "de",
              },
              {
                  **base,
                  "id": "fr_service_public_business",
                  "name": "France Service Public - Business Updates",
                  "url": "https://www.service-public.gouv.fr/abonnements/rss/actu-actu-pro.rss",
                  "allowed_domains": ["www.service-public.gouv.fr"],
                  "article_domains": [
                      "www.service-public.gouv.fr", "service-public.gouv.fr",
                      "entreprendre.service-public.gouv.fr",
                  ],
                  "publisher_origin_id": "fr_dila", "category": "Government",
                  "country": "France", "region": "Europe", "language": "fr",
              },
          ]
          catalog = {row["id"]: row for row in load_catalog()}
          failures = []
          for candidate in candidates:
              actual = catalog.get(candidate["id"])
              assert actual is not None, candidate["id"] + ": missing from catalog"
              for field in ("url", "adapter", "publisher_origin_id", "language", "allowed_domains", "article_domains", "category", "country"):
                  assert actual.get(field) == candidate.get(field), f"{candidate['id']}: unexpected {field}"
              assert actual["enabled"] is True and actual["metadata_only"] is True
              found = Collector(actual).collect()
              state = found["state"]
              reports = found["reports"]
              recent = [
                  item for item in reports
                  if item.get("published_at")
                  and 0 <= datetime.now(timezone.utc).timestamp() - timestamp(item["published_at"]) <= 21 * 86400
              ]
              bad = [
                  item for item in reports
                  if item.get("summary") or item.get("media")
                  or item.get("origin_id") != candidate["publisher_origin_id"]
                  or not item.get("url") or urlsplit(item["url"]).scheme != "https"
                  or urlsplit(item["url"]).hostname not in candidate["article_domains"]
              ]
              result = {
                  "candidate": candidate["id"], "status": state.get("status"),
                  "http_status": state.get("http_status"), "reports": len(reports),
                  "dated_recent_reports": len(recent),
                  "latest_publication": state.get("latest_publication") or "",
                  "provenance_or_metadata_violations": len(bad),
                  "error": state.get("error") or "",
              }
              print("LIVE_CANDIDATE_PROBE", json.dumps(result, sort_keys=True), flush=True)
              if (result["status"] != "available" or result["http_status"] != 200
                      or not result["reports"] or not result["dated_recent_reports"]
                      or result["provenance_or_metadata_violations"]):
                  failures.append(candidate["id"])
          if failures:
              raise SystemExit("NOT ADMITTED: " + ", ".join(failures))
          print("BOTH_FEEDS_LIVE_ADMISSION_PASS")
          PY
