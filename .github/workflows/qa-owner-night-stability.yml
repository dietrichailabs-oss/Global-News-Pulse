name: QA Lane - Owner Night Map and Responsiveness

on:
  push:
    branches: [qa/owner-night-map-stability-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-owner-night-map-stability
  cancel-in-progress: true

jobs:
  adversarial-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact Engineering ancestor and QA-only changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e2c15a4104e71c096949303a25cac400568d30ee HEAD
          unexpected="$(git diff --name-only e2c15a4104e71c096949303a25cac400568d30ee..HEAD | grep -v -E '^(tests/test_qa_owner_night_stability.py|\.github/workflows/qa-owner-night-stability.yml)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "QA branch changed product/runtime: $unexpected" >&2
            exit 1
          fi
          echo "REVIEWED_PRODUCT=e2c15a4104e71c096949303a25cac400568d30ee"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Compile current product
        shell: bash
        run: python -m compileall -q global_pulse
      - name: QA-only adversarial source and Qt regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_qa_owner_night_stability.py tests/test_owner_night_stability_map.py tests/test_issue22_situation_stars.py tests/test_issue37_country_owner_video.py tests/test_ui_desktop.py
      - name: Ensure tracked tree unchanged by tests
        if: always()
        shell: bash
        run: git diff --exit-code
