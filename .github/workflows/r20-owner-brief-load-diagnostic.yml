name: R20 exact owner Generate loaded-archive diagnostic
on:
  push:
    branches: [eng/r20-brief-paged-load-20261127]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Exact product identity and locked dependencies
        shell: bash
        run: |
          git diff --exit-code 0ea58c24125a442203b06823f1cd4f621f84ba62 HEAD -- global_pulse tests requirements-bootstrap.lock requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Repeat full load with actual Daily and Weekly Generate
        shell: bash
        run: |
          python -m compileall -q global_pulse scripts/qa_r20_owner_generate_load.py
          rc=0
          for trial in 1 2; do
            echo "R20_GENERATE_TRIAL=$trial source=0ea58c24125a442203b06823f1cd4f621f84ba62"
            if R20_MATCHED_TRIAL="$trial" python -m scripts.qa_r20_owner_generate_load; then
              result=0
            else
              result=$?
            fi
            echo "R20_GENERATE_EXIT=$result trial=$trial"
            if [ "$result" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
