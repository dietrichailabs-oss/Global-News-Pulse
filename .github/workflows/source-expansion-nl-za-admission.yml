name: Source Expansion - Netherlands South Africa Post-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-nl-za-admission.yml
      - tests/test_source_expansion_nl_za.py
      - global_pulse/resources/sources.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checked-catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline origin, licence metadata and no-body parser regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_nl_za.py tests/test_issue22_publisher_origin_group.py
      - name: Strict real Collector admission from enabled checked-out catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp
          expected={
            "nl_cbs_news":("nl_cbs","https://www.cbs.nl/en-gb/rss-feeds/all-news-items"),
            "nl_cbs_economy":("nl_cbs","https://www.cbs.nl/en-gb/rss-feeds/economie"),
            "nl_cbs_health":("nl_cbs","https://www.cbs.nl/en-gb/rss-feeds/gezondheid-en-welzijn"),
            "nl_cbs_energy":("nl_cbs","https://www.cbs.nl/en-gb/rss-feeds/industrie-en-energie"),
            "za_sanews_news":("za_sanews","https://www.sanews.gov.za/south-africa-news-stories.xml"),
            "za_sanews_features":("za_sanews","https://www.sanews.gov.za/features.xml"),
          }
          catalog={s["id"]:s for s in load_catalog()}
          now=datetime.now(timezone.utc).timestamp()
          failures=[]
          for i,(sid,(origin,url)) in enumerate(expected.items()):
              if i: time.sleep(4)
              row=catalog[sid]
              assert row["enabled"] and row["metadata_only"] and row["publisher_origin_id"]==origin
              assert row["url"]==url and row["access_status"]=="reviewed_public"
              assert row["min_interval"]>=3600 and row["license_url"] and row["feed_documentation"]
              result=Collector(row).collect()
              state=result["state"]; reports=result["reports"]
              recent=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in reports if not r.get("title") or not r.get("published_at")
                or not r.get("attribution") or r.get("summary") or r.get("media")
                or r.get("origin_id")!=origin or r.get("country_basis")!="publisher_coverage"
                or r.get("original_url")!=r.get("url") or urlsplit(r.get("url","")).scheme!="https"
                or urlsplit(r.get("url","")).hostname not in row["article_domains"]]
              success=bool(state.get("status")=="available" and state.get("http_status")==200
                and reports and recent and not bad)
              record=dict(id=sid,origin=origin,passed=success,status=state.get("status"),
                http_status=state.get("http_status"),reports=len(reports),recent_30d=len(recent),
                latest=state.get("latest_publication") or "",violations=len(bad),
                error=state.get("error") or "")
              print("NL_ZA_POST_ADMISSION",json.dumps(record,sort_keys=True),flush=True)
              if not success:failures.append(sid)
          if failures:raise SystemExit("NL_ZA_ADMISSION_FAILURE: "+",".join(failures))
          print("NL_ZA_SIX_FEEDS_POST_ADMISSION_PASS",flush=True)
          PY
