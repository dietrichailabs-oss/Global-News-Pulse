name: Issue76 Unified Qt Quit Paths - Engineering Windows Linux

on:
  push:
    branches: [eng/issue76-unified-quit-paths-20261114]
    paths:
      - '.github/workflows/issue76-unified-quit-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue76-unified-quit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify exact current PR77 parent and isolated three-path correction
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fe70664adf0456b4234fe0dfe5bf2a628b017e75 HEAD
          git diff --name-only fe70664adf0456b4234fe0dfe5bf2a628b017e75..HEAD | python -c "import sys; expected={'global_pulse/__main__.py','tests/test_issue76_quit_paths.py','.github/workflows/issue76-unified-quit-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
          echo "ISSUE76_PR77_PARENT=fe70664adf0456b4234fe0dfe5bf2a628b017e75"
          echo "FULL_NATIVE_WINDOWS_PACKAGE_STILL_REQUIRED=true"
          echo "RIGHTS_PR17=HOLD"
      - name: Match native Windows Qt backend
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Syntax and source compile
        shell: bash
        run: python -m compileall -q global_pulse tests/test_issue76_quit_paths.py
      - name: Native Qt quit path and existing owner regressions - real process exit required
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue76_quit_paths.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_issue31_tv_basic_player.py tests/test_issue37_country_owner_video.py tests/test_issue21_sdr_owner_controls.py tests/test_issue22_owner_media_lineup.py tests/test_issue22_situation_stars.py tests/test_issue74_row_lifetime.py tests/test_ui_desktop.py tests/test_owner_feedback_qa_repairs.py
          echo "FOCUSED_PYTHON_NATIVE_EXIT=0"
      - name: Check tracked source cleanliness
        if: always()
        shell: bash
        run: git diff --exit-code
