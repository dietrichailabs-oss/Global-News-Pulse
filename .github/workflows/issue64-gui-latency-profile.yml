name: Issue64 Engineering Qt Responsiveness Profile (No Package)

on:
  push:
    branches: [eng/issue64-gui-latency-probe-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue64-gui-latency-profile
  cancel-in-progress: true

jobs:
  native-offscreen-latency:
    name: GUI timing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify frozen PR65 parent and exactly two profiling-only files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ac8a2ac3443f86f7197a0a145cfe9eebd3a40574 HEAD
          git diff --name-only ac8a2ac3443f86f7197a0a145cfe9eebd3a40574..HEAD | python -c "import sys; expected={'tests/test_issue64_gui_latency_profile.py','.github/workflows/issue64-gui-latency-profile.yml'}; actual={line.strip() for line in sys.stdin if line.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile profile without modifying production
        shell: bash
        run: python -m py_compile tests/test_issue64_gui_latency_profile.py
      - name: Measure actual Qt GUI actions, SQLite archive and next-loop delay
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue64_gui_latency_profile.py
      - name: Ensure clean tracked tree
        if: always()
        shell: bash
        run: git diff --exit-code
