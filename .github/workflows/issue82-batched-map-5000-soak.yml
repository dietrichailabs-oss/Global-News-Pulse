name: Issue82 Batched Map 5000 Concurrent Qt Soak - Diagnostic Only

on:
  push:
    branches: [diag/issue82-batched-map-5000-after-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue82-batched-5000-gui-soak
  cancel-in-progress: true

jobs:
  focused-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm exact PR89 batched map product and two diagnostic-only paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor d98b1a9f5f05a8518ed126acc56bf08ddb4fb5bf HEAD
          git diff --name-only d98b1a9f5f05a8518ed126acc56bf08ddb4fb5bf..HEAD | python -c "import sys; expected={'.github/workflows/issue82-batched-map-5000-soak.yml','tests/test_issue82_5000_concurrent_gui_soak.py'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Match native Windows Qt layout and font backend
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Syntax and source compile
        shell: bash
        run: python -m compileall -q global_pulse tests/test_issue82_5000_concurrent_gui_soak.py
      - name: Real 5k SQLite map concurrent writer and GUI heartbeat, timed diagnostic only
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue82_5000_concurrent_gui_soak.py
      - name: Check tracked product cleanliness
        if: always()
        shell: bash
        run: git diff --exit-code
