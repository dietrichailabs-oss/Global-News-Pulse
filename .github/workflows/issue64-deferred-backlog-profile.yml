name: Issue64 Engineering Deferred Queue Responsiveness Probe

on:
  push:
    branches: [eng/issue64-deferred-gui-backlog-profile-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue64-deferred-backlog
  cancel-in-progress: true

jobs:
  profile:
    name: Deferred backlog and navigation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Guard exact accepted source and only two diagnostic paths
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fd8d5969f2194f7257455074b7c18ffc6ce1aa3a HEAD
          git diff --name-only fd8d5969f2194f7257455074b7c18ffc6ce1aa3a..HEAD | python -c "import sys; expected={'tests/test_issue64_deferred_backlog_profile.py','.github/workflows/issue64-deferred-backlog-profile.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
          python -m py_compile tests/test_issue64_deferred_backlog_profile.py
      - name: Actual 820-record Qt backlog with batch 16 (native Python exit required)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short 'tests/test_issue64_deferred_backlog_profile.py::test_820_record_deferred_queue_during_actual_gui_navigation[16]'
      - name: Actual 820-record Qt backlog with batch 64 (fresh native process)
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short 'tests/test_issue64_deferred_backlog_profile.py::test_820_record_deferred_queue_during_actual_gui_navigation[64]'
      - name: Verify no tracked product changes
        if: always()
        shell: bash
        run: git diff --exit-code
