name: Owner Night Source Category Filter Canonicalization CI

on:
  push:
    branches: [eng/owner-night-category-filter-canonical-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owner-night-category-filter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  canonical-map-ui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm exact owner-night parent and narrow source/test diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b67e495658408066fe69cefcd04c23db707ab532 HEAD
          git diff --name-only b67e495658408066fe69cefcd04c23db707ab532..HEAD | python -c "import sys; allowed={'global_pulse/map_widget.py','tests/test_owner_night_category_filter_canonical.py','.github/workflows/owner-night-canonical-category-filter-ci.yml'}; found={x.strip() for x in sys.stdin if x.strip()}; assert found==allowed,(found,allowed)"
      - name: Compile
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Country category filter, map, Star-tab, dialogs, TV and NWS regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_owner_night_category_filter_canonical.py tests/test_owner_night_stability_map.py tests/test_ui_desktop.py tests/test_issue37_country_owner_video.py tests/test_issue22_situation_stars.py tests/test_issue22_filtered_star_binding.py tests/test_nws_zone_resolution.py tests/test_issue31_tv_basic_player.py tests/test_tv_pending_timeout.py tests/test_issue22_map_pipeline.py
      - name: Verify tracked source clean after tests
        if: always()
        shell: bash
        run: git diff --exit-code
