name: R20 event loop scheduling isolation diagnostic
on:
  push:
    branches: [eng/r20-eventloop-scheduling-diagnostic-20261127]
permissions:
  contents: read
jobs:
  isolate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        wait_mode: [pump, eventloop]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      R20_WAIT_MODE: ${{ matrix.wait_mode }}
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Locked dependencies
        shell: bash
        run: |
          git diff --exit-code b4a8d6d9f63d06b4ceefccda557ead349938769b HEAD -- global_pulse requirements-bootstrap.lock requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Identical isolated regression on exact candidate and predecessor
        shell: bash
        run: |
          set -uo pipefail
          diagnostic="$PWD/tests/test_r20_filter_window_responsiveness.py"
          git worktree add --detach "$RUNNER_TEMP/gp-headline-old" 0cc019ea8e118f8273f4683a93d923ec48c5eb62
          git worktree add --detach "$RUNNER_TEMP/gp-headline-new" b4a8d6d9f63d06b4ceefccda557ead349938769b
          rc=0
          for trial in 1 2; do
            for variant in old new; do
              if (
                cd "$RUNNER_TEMP/gp-headline-$variant" || exit 1
                actual=$(git rev-parse HEAD) || exit 1
                case "$variant" in
                  old) expected=0cc019ea8e118f8273f4683a93d923ec48c5eb62 ;;
                  new) expected=b4a8d6d9f63d06b4ceefccda557ead349938769b ;;
                  *) exit 1 ;;
                esac
                test "$actual" = "$expected" || exit 1
                echo "R20_ISOLATION=$variant trial=$trial head=$actual wait=$R20_WAIT_MODE"
                cp "$diagnostic" "tests/test_r20_filter_window_responsiveness.py" || exit 1
                git diff --exit-code -- global_pulse requirements-bootstrap.lock requirements-build.lock || exit 1
                python -m pytest -q -s --tb=short tests/test_r20_filter_window_responsiveness.py
              ); then
                result=0
              else
                result=$?
              fi
              echo "R20_ISOLATION_EXIT=$result variant=$variant trial=$trial"
              if [ "$result" -ne 0 ]; then rc=1; fi
            done
          done
          exit "$rc"
  matched:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        wait_mode: [pump, eventloop]
        variant: [old, new]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      R20_WAIT_MODE: ${{ matrix.wait_mode }}
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Locked dependencies
        shell: bash
        run: |
          git diff --exit-code b4a8d6d9f63d06b4ceefccda557ead349938769b HEAD -- global_pulse requirements-bootstrap.lock requirements-build.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Exact full-load comparison under selected wait mechanism
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -uo pipefail
          case "$VARIANT" in
            old) expected=0cc019ea8e118f8273f4683a93d923ec48c5eb62 ;;
            new) expected=b4a8d6d9f63d06b4ceefccda557ead349938769b ;;
            *) exit 1 ;;
          esac
          probe="$PWD/scripts/qa_r20_brief_loaded_archive.py"
          git worktree add --detach "$RUNNER_TEMP/gp-eventloop-load" "$expected"
          cd "$RUNNER_TEMP/gp-eventloop-load"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --exit-code -- global_pulse requirements-bootstrap.lock requirements-build.lock
          rc=0
          for trial in 1 2; do
            echo "R20_EVENTLOOP_LOAD=$VARIANT trial=$trial head=$expected wait=$R20_WAIT_MODE"
            if R20_MATCHED_TRIAL="$trial" python -c 'import runpy,sys; p=sys.argv.pop(1); runpy.run_path(p,run_name="__main__")' "$probe"; then
              result=0
            else
              result=$?
            fi
            echo "R20_EVENTLOOP_LOAD_EXIT=$result variant=$VARIANT trial=$trial wait=$R20_WAIT_MODE"
            if [ "$result" -ne 0 ]; then rc=1; fi
          done
          exit "$rc"
