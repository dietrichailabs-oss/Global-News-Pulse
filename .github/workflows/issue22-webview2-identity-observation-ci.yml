name: Issue22 WebView2 Referer Observation - Engineering
on:
  push:
    branches: [eng/issue22-webview2-referer-observation-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verification:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install hash-locked Python environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Check frozen PR143 lineage and exact source/test/CI changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1f1c88b1e0bc77b3c3122dc20a2f55157e2db8dd HEAD
          git diff --name-only 1f1c88b1e0bc77b3c3122dc20a2f55157e2db8dd HEAD | python -c "import sys; expected={'.github/workflows/issue22-webview2-identity-observation-ci.yml','packaging/tv/NativeTvProgram.cs','global_pulse/single_media.py','tests/test_issue22_webview2_identity_observation.py'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Use native hosted Windows Qt platform
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Compile Python and verify exact-source Qt idle, TV and identity regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse tests/test_issue22_webview2_identity_observation.py
          python -m pytest -q --tb=short tests/test_issue22_webview2_identity_observation.py tests/test_issue82_native_tv_policy.py tests/test_issue82_tv_visible_diagnostics.py tests/test_issue22_idle_brief_worker.py tests/test_issue22_idle_collector_snapshot.py
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        if: runner.os == 'Windows'
        with:
          dotnet-version: '10.0.403'
      - name: Build native Windows WebView2 helper and run real policy executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet restore packaging/tv/GlobalPulse.TV.csproj --runtime win-x64 --locked-mode
          if ($LASTEXITCODE -ne 0) { throw "Locked native restore failed" }
          dotnet publish packaging/tv/GlobalPulse.TV.csproj --configuration Release --runtime win-x64 --self-contained true --no-restore --output build/webview2-identity-test -p:PublishSingleFile=false -p:PublishTrimmed=false
          if ($LASTEXITCODE -ne 0) { throw "Native compile failed" }
          & build/webview2-identity-test/GlobalPulse.TV.exe --self-test-policy
          if ($LASTEXITCODE -ne 0) { throw "Native resource/navigation policy rejected" }
      - name: Confirm tracked source clean
        if: always()
        shell: bash
        run: git diff --exit-code
