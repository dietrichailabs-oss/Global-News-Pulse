name: Issue22 Economy Map Warm Navigation Engineering
on:
  push:
    branches: [eng/issue22-economy-map-warm-selection-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Frozen accepted parent and exact three-file correction
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b33977d70645ea1f9f9582cffca66c1255714b72 HEAD
          git diff --name-only b33977d70645ea1f9f9582cffca66c1255714b72 HEAD | python -c "import sys; expected={'.github/workflows/issue22-economy-map-warm-navigation-ci.yml','global_pulse/ui.py','tests/test_issue22_economy_map_warm_navigation.py'}; actual={p.strip() for p in sys.stdin if p.strip()}; assert actual==expected,(actual,expected)"
      - name: Native Windows Qt
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Compile and run Economy map, archive, and tab responsiveness regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse tests/test_issue22_economy_map_warm_navigation.py
          python -m pytest -q --tb=short tests/test_issue22_economy_map_warm_navigation.py tests/test_issue82_owner_tab_paint_cpu.py tests/test_issue61_map_click_navigation.py tests/test_issue64_archive_overview_boundary.py
      - name: Clean tracked source
        if: always()
        shell: bash
        run: git diff --exit-code
