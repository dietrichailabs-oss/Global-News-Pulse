name: Issue74 Windows Sidebar and Feed Qt Regression

on:
  push:
    branches: [eng/issue74-sidebar-feed-ownership-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue74-qt-feed-recovery
  cancel-in-progress: true

jobs:
  verify-qt-source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install exact locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm frozen PR73 product and exactly scoped changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a6091b0a2bcd22ec41e38d8343a8583617f7c017 HEAD
          git diff --name-only a6091b0a2bcd22ec41e38d8343a8583617f7c017..HEAD | python -c "import sys; expected={'global_pulse/ui.py','tests/test_e2_readable_sidebar.py','tests/test_issue74_row_lifetime.py','.github/workflows/issue74-qt-gui-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Original seven failed tests plus full related Qt acceptance
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue74_row_lifetime.py tests/test_e2_readable_sidebar.py tests/test_issue22_filtered_star_binding.py tests/test_issue22_situation_stars.py tests/test_issue64_intelligence_brief.py tests/test_issue61_map_click_navigation.py
      - name: Preserve tracked source
        if: always()
        shell: bash
        run: git diff --exit-code
