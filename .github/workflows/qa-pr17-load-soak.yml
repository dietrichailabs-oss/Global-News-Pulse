name: Independent QA - PR17 Expanded Source Load

on:
  push:
    branches: [qa/pr17-load-soak-20261113]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-pr17-load-soak
  cancel-in-progress: true

jobs:
  load-soak:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Confirm exact product ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor c2d6f6a5e84579bf5c0427589c26b564674055e2 HEAD
          echo "PR17_REVIEWED_HEAD=c2d6f6a5e84579bf5c0427589c26b564674055e2"
      - name: Run exact 127-source load/restart checks
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_qa_pr17_load_soak.py
      - name: Run existing capacity/backoff regression suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_source_capacity_headlines.py tests/test_sources.py
