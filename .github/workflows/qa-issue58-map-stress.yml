name: QA Issue58 Map Frame Stress - Frozen Source

on:
  push:
    branches: [qa/issue58-map-frame-stress-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-issue58-map-frame
  cancel-in-progress: true

jobs:
  independent-scope-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify QA-only provenance
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor e05fa657ebd3ad1bc5ba3703115a8f1b635d1271 HEAD
          git diff --name-only e05fa657ebd3ad1bc5ba3703115a8f1b635d1271..HEAD | python -c "import sys; expected={'tests/test_qa_issue58_map_stress.py','.github/workflows/qa-issue58-map-stress.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile unchanged product
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Paired 5k-point hover repaint timings (informational, no threshold)
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach ../issue58-before 9346c3e90b9542308d61aa15a9783cf74380a197
          for label in before after; do
            if [ "$label" = before ]; then workdir=../issue58-before; else workdir="$PWD"; fi
            (
              cd "$workdir"
              python - "$label" <<'PY'
          import os, sys, time, statistics
          os.environ.setdefault("QT_QPA_PLATFORM", "offscreen")
          from PySide6.QtWidgets import QApplication
          from global_pulse.map_widget import WorldMap
          label=sys.argv[1]
          app=QApplication.instance() or QApplication([])
          world=WorldMap()
          world.resize(1600,760)
          world.show()
          world.events=[{"id":str(i),"longitude":-170+(i%34)*9.7,
                         "latitude":-45+(i%17)*6.4, "category":"Government",
                         "severity":"moderate","verification":"unverified"}
                        for i in range(5000)]
          for _ in range(3):
              world.grab()
          durations=[]
          for i in range(60):
              world._hover_country = ("Canada" if i%2 else "France")
              start=time.perf_counter()
              world.grab()
              durations.append((time.perf_counter()-start)*1000)
          print("PAIRED_QA_RENDER_%s P50_MS=%.3f MAX_MS=%.3f" %
                (label,statistics.median(durations),max(durations)),flush=True)
          world.close()
          del world
          PY
            )
          done
          git worktree remove --force ../issue58-before
      - name: QA-only map stress with geometry / provenance suites
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_qa_issue58_map_stress.py tests/test_issue58_map_paint_cache.py tests/test_owner_night_stability_map.py tests/test_issue22_country_only_retest.py
      - name: Verify clean product tree
        if: always()
        shell: bash
        run: git diff --exit-code
