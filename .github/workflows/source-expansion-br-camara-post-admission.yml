name: Source Expansion - Brazil Câmara Post-Admission Live and Provenance
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-br-camara-post-admission.yml
      - global_pulse/resources/sources.json
      - tests/test_source_expansion_br_camara.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camara-post-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Exact catalog source rights, parser, independence and provenance regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_br_camara.py tests/test_issue22_publisher_origin_group.py tests/test_source_expansion_bcb.py
      - name: Exact committed catalog direct post-admission Collector checks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp
          catalog={s["id"]:s for s in load_catalog()}
          identities=("br_camara_all","br_camara_health","br_camara_economy")
          now=datetime.now(timezone.utc).timestamp()
          failures=[]
          for i,sid in enumerate(identities):
              if i: time.sleep(3)
              source=catalog[sid];out=Collector(source).collect();st=out["state"];reports=out["reports"]
              fresh=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in reports if not r.get("title") or not r.get("published_at")
                  or r.get("attribution")!=source["attribution"]
                  or r.get("summary") or r.get("media")
                  or r.get("origin_id")!="br_camara"
                  or r.get("original_url")!=r.get("url")
                  or r.get("country_basis")!="publisher_coverage"
                  or r.get("latitude") is not None or r.get("longitude") is not None
                  or urlsplit(r.get("url","")).hostname not in source["article_domains"]
                  or urlsplit(r.get("url","")).scheme!="https"]
              passed=bool(st.get("status")=="available" and st.get("http_status")==200
                  and reports and fresh and not bad and source["enabled"] and source["metadata_only"]
                  and source["publisher_origin_id"]=="br_camara")
              evidence=dict(id=sid,passed=passed,status=st.get("status"),http_status=st.get("http_status"),
                  reports=len(reports),recent_30d=len(fresh),violations=len(bad),
                  latest=st.get("latest_publication"),error=st.get("error",""),
                  publisher_origin_id=source["publisher_origin_id"],
                  original_links=[r.get("original_url") for r in reports[:2]])
              print("BR_CAMARA_POST_ADMISSION",json.dumps(evidence,ensure_ascii=False,sort_keys=True),flush=True)
              if not passed:failures.append(sid)
          if failures:raise SystemExit("Câmara post-admission gate FAIL: "+", ".join(failures))
          print("PASS 3/3; one publisher family, no article-body or media retention",flush=True)
          PY
