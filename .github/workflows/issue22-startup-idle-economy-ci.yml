name: Issue22 Startup Idle and Economy Intent Engineering
on:
  push:
    branches: [eng/issue22-startup-idle-economy-selection-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify frozen parent and exact scoped files
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a0949ef6777b05b435d3dee634c4cd6e2f4004a2 HEAD
          git diff --name-only a0949ef6777b05b435d3dee634c4cd6e2f4004a2 HEAD | python -c "import sys; expected={'.github/workflows/issue22-startup-idle-economy-ci.yml','global_pulse/ui.py','tests/test_issue22_startup_idle_profile.py'}; actual={p.strip() for p in sys.stdin if p.strip()}; assert actual==expected,(actual,expected)"
      - name: Native hosted Windows Qt
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Measure actual no-click idle Qt and test Economy last-intent selection
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse tests/test_issue22_startup_idle_profile.py
          python -m pytest -s -q --tb=short tests/test_issue22_startup_idle_profile.py tests/test_issue22_economy_map_warm_navigation.py tests/test_issue82_owner_tab_paint_cpu.py
      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: git diff --exit-code
