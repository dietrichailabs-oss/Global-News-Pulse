name: Issue64 Explicit Feed Eviction Engineering
on:
  push:
    branches: [eng/issue64-explicit-feed-selection-eviction-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify frozen parent and bounded three-file explicit-selection scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor a4571e255c55b2e147a45ff4442fab1e18a20c44 HEAD
          git diff --name-only a4571e255c55b2e147a45ff4442fab1e18a20c44 HEAD | python -c "import sys; expected={'.github/workflows/issue64-explicit-feed-eviction-ci.yml','global_pulse/ui.py','tests/test_issue64_archive_overview_boundary.py'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Native Windows Qt
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Compile and run focused archive-feed eviction, source/evidence/Star regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse tests/test_issue64_archive_overview_boundary.py
          python -m pytest -q --tb=short tests/test_issue64_archive_overview_boundary.py tests/test_issue64_daily_weekly_archive.py tests/test_issue64_intelligence_brief.py tests/test_issue61_map_click_navigation.py tests/test_issue22_filtered_star_binding.py
      - name: Clean tracked source
        if: always()
        shell: bash
        run: git diff --exit-code
