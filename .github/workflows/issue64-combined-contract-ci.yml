name: Issue64 Engineering Combined Source Contracts

on:
  push:
    branches: [eng/issue64-combined-win-owner-gates-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue64-combined-brief-nws-teardown
  cancel-in-progress: true

jobs:
  repaint:
    name: Offline Qt backlog and original evidence (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify PR72 product and six-path test/workflow-only integration
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor dce0be45f53d4eca3aba700cb37d89477f91aa7f HEAD
          git diff --name-only dce0be45f53d4eca3aba700cb37d89477f91aa7f..HEAD | python -c "import sys; expected={'tests/test_eng_replay_nws_qa62.py','tests/test_map_evidence_geometry.py','tests/test_nws_zone_deadline.py','tests/conftest.py','.github/workflows/issue64-combined-native-owner-package.yml','.github/workflows/issue64-combined-contract-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
          python -m compileall -q global_pulse tests/conftest.py
      - name: Native tests for batching, cancellation, language routing, source evidence
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue64_deferred_batch64.py tests/test_issue64_deferred_cold_headlines.py tests/test_issue64_bounded_headline_routing.py tests/test_headline_desktop_flow.py tests/test_issue64_intelligence_brief.py tests/test_eng_replay_nws_qa62.py tests/test_map_evidence_geometry.py tests/test_nws_zone_deadline.py tests/test_nws_zone_resolution.py
      - name: Actual 820-record SQLite/Qt backlog with product batch 64
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short 'tests/test_issue64_deferred_backlog_profile.py::test_820_record_deferred_queue_during_actual_gui_navigation[64]'
      - name: Verify tracked product source clean
        if: always()
        shell: bash
        run: git diff --exit-code
