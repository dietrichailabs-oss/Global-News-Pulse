name: Source Expansion - South Korea Publisher-Direct Pre-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-kr-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kr-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Run parser and origin identity regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_issue22_publisher_origin_group.py tests/test_source_expansion_open_feeds.py
      - name: Probe Korean first-party RSS with actual bounded Collector; do not enable
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          candidates=[
            ("kr_bok_all","Bank of Korea - all press releases","https://www.bok.or.kr/portal/bbs/B0000552/news.rss?menuNo=200690","kr_bok","Economy","measurement","www.bok.or.kr"),
            ("kr_bok_economic","Bank of Korea - economic statistics","https://www.bok.or.kr/portal/bbs/B0000501/news.rss?menuNo=201264","kr_bok","Economy","measurement","www.bok.or.kr"),
            ("kr_kcc_press","Korea Copyright Commission - press","https://www.copyright.or.kr/open/public-data/rss/rss.do?mode=news","kr_kcc","Government","statement","www.copyright.or.kr"),
            ("kr_kcc_notices","Korea Copyright Commission - notices","https://www.copyright.or.kr/open/public-data/rss/rss.do?mode=notice","kr_kcc","Government","statement","www.copyright.or.kr"),
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,name,url,origin,category,scope,hostname) in enumerate(candidates):
            if i: time.sleep(4)
            s=dict(id=sid,name=name,url=url,homepage="https://"+hostname+"/",
                adapter="rss",enabled=True,metadata_only=True,access_status="reviewed_public",
                independence="original",official=True,official_scope=scope,category=category,
                region="Asia",country="South Korea",language="ko",publisher_origin_id=origin,
                min_interval=3600,stale_after_days=30,retention_days=90,
                allowed_domains=[hostname],article_domains=[hostname,hostname.removeprefix("www.")],
                attribution=name+"; direct publisher link and date; no endorsement")
            try:
              result=Collector(s).collect()
              state=result["state"]; reports=result["reports"]
              recent=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
              violations=[r for r in reports if not r.get("title") or not r.get("published_at")
                  or not r.get("attribution") or r.get("summary") or r.get("media")
                  or r.get("origin_id")!=origin or r.get("url")!=r.get("original_url")
                  or r.get("country_basis")!="publisher_coverage"
                  or r.get("latitude") is not None or r.get("longitude") is not None
                  or urlsplit(r.get("url","")).scheme!="https"
                  or urlsplit(r.get("url","")).hostname not in s["article_domains"]]
              record=dict(id=sid,technically_eligible=bool(state.get("status")=="available" and
                  state.get("http_status")==200 and len(reports)>0 and len(recent)>0 and not violations),
                  status=state.get("status"),http_status=state.get("http_status"),
                  count=len(reports),recent_30d=len(recent),latest=state.get("latest_publication"),
                  violations=len(violations),error=state.get("error",""),
                  original_urls=[r.get("original_url") for r in reports[:2]],
                  publisher_origin_id=origin,rights_gate="NOT_REVIEWED; NO_ADMISSION")
            except Exception as exc:
              record=dict(id=sid,technically_eligible=False,rights_gate="NOT_REVIEWED; NO_ADMISSION",
                  error=type(exc).__name__+": "+str(exc)[:140])
            print("KR_SOURCE_PROBE",json.dumps(record,ensure_ascii=False,sort_keys=True),flush=True)
          print("PROBE_ONLY: NO_CATALOG_MUTATION; NO_RIGHTS_APPROVAL; NO_RELEASE",flush=True)
          PY
