name: Source Expansion - Norway SSB and EEA Post-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-no-eea-admission.yml
      - tests/test_source_expansion_no_eea.py
      - global_pulse/resources/sources.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-catalog-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline provenance, parser, attribution and sibling-origin regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_no_eea.py tests/test_issue22_publisher_origin_group.py
      - name: Collect live checked-out catalog entries with strict admission
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector, load_catalog, timestamp
          expectations = {
            "norway_ssb_latest": ("https://www.ssb.no/en/rss/", "norway_ssb"),
            "norway_ssb_labour": ("https://www.ssb.no/en/rss/arbeid-og-lonn", "norway_ssb"),
            "norway_ssb_energy": ("https://www.ssb.no/en/rss/energi-og-industri", "norway_ssb"),
            "eea_press_releases": ("https://www.eea.europa.eu/en/newsroom/rss-feeds/eeas-press-releases-rss/rss.xml", "eu_eea"),
            "eea_publications": ("https://www.eea.europa.eu/en/newsroom/rss-feeds/publications-rss/rss.xml", "eu_eea"),
          }
          catalog = {row["id"]: row for row in load_catalog()}
          assert len({catalog[k]["publisher_origin_id"] for k in list(expectations)[:3]}) == 1
          assert len({catalog[k]["publisher_origin_id"] for k in list(expectations)[3:]}) == 1
          now = datetime.now(timezone.utc).timestamp()
          failures = []
          for identity, (url, origin) in expectations.items():
              row = catalog[identity]
              assert row["url"] == url and row["publisher_origin_id"] == origin
              assert row["enabled"] is True and row["access_status"] == "reviewed_public"
              assert row["metadata_only"] is True and row["min_interval"] >= 1800
              assert row["license_url"].startswith("https://") and row["attribution"]
              output = Collector(row).collect()
              state = output["state"]; reports = output["reports"]
              recent = [r for r in reports if r.get("published_at")
                    and 0 <= now - timestamp(r["published_at"]) <= 30*86400]
              invalid = [r for r in reports if r.get("summary") or r.get("media")
                    or not r.get("title") or not r.get("published_at") or not r.get("attribution")
                    or r.get("origin_id") != origin or r.get("country_basis") != "publisher_coverage"
                    or urlsplit(r.get("url", "")).scheme != "https"
                    or urlsplit(r.get("url", "")).hostname not in row["article_domains"]]
              success = bool(state.get("status") == "available" and state.get("http_status") == 200
                    and reports and recent and not invalid)
              print("POST_ADMISSION", json.dumps(dict(id=identity, origin=origin,
                    pass_post_admission=success, status=state.get("status"),
                    http_status=state.get("http_status"), reports=len(reports),
                    recent_30d=len(recent), latest=state.get("latest_publication") or "",
                    violations=len(invalid), error=state.get("error") or ""), sort_keys=True), flush=True)
              if not success: failures.append(identity)
          if failures: raise SystemExit("POST_ADMISSION_FAILED: " + ", ".join(failures))
          print("FIVE_LICENSED_FEEDS_POST_ADMISSION_PASS")
          PY
