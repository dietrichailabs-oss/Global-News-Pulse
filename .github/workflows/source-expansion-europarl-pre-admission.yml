name: Source Expansion - European Parliament RSS Pre-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-europarl-pre-admission.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  europarl-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env: {PYTHONUTF8: '1', PYTHONNOUSERSITE: '1', PIP_NO_INPUT: '1'}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Install pinned parser dependencies
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Offline provenance baseline
        run: python -m pytest -q tests/test_source_expansion_open_feeds.py tests/test_issue22_publisher_origin_group.py
      - name: Direct publisher live Collector gate; no catalog changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,time
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,timestamp
          endpoints=[
            ("eu_parliament_press","https://www.europarl.europa.eu/rss/doc/press-releases/en.xml","Government"),
            ("eu_parliament_plenary","https://www.europarl.europa.eu/rss/doc/press-releases-plenary/en.xml","Government"),
            ("eu_parliament_committees","https://www.europarl.europa.eu/rss/doc/press-releases-committees/en.xml","Government"),
            ("eu_parliament_top_stories","https://www.europarl.europa.eu/rss/doc/top-stories/en.xml","News")
          ]
          now=datetime.now(timezone.utc).timestamp()
          for i,(sid,url,category) in enumerate(endpoints):
            if i:time.sleep(3)
            s=dict(id=sid,name="European Parliament RSS - "+sid,url=url,adapter="rss",
              enabled=True,metadata_only=True,category=category,region="Europe",country="",
              official=True,official_scope="statement",access_status="reviewed_public",
              publisher_origin_id="eu_parliament",independence="original",language="en",
              min_interval=3600,stale_after_days=30,retention_days=90,
              allowed_domains=["www.europarl.europa.eu"],
              article_domains=["www.europarl.europa.eu","europarl.europa.eu"],
              attribution="European Parliament (© European Union – EP); source headline, publication date, direct original link; no endorsement")
            try:
              out=Collector(s).collect();st=out["state"];reports=out["reports"]
              recent=[r for r in reports if r.get("published_at") and
                0<=now-timestamp(r["published_at"])<=30*86400]
              bad=[r for r in reports if not r.get("title") or not r.get("published_at")
                or not r.get("original_url") or r.get("url")!=r.get("original_url")
                or r.get("summary") or r.get("media") or r.get("origin_id")!="eu_parliament"
                or r.get("attribution")!=s["attribution"]
                or r.get("country_basis")!="publisher_coverage"
                or r.get("latitude") is not None or r.get("longitude") is not None
                or urlsplit(r.get("url","")).scheme!="https"
                or urlsplit(r.get("url","")).hostname not in s["article_domains"]]
              passed=bool(st.get("status")=="available" and st.get("http_status")==200
                and reports and recent and not bad)
              evidence=dict(id=sid,origin="eu_parliament",technical_eligible=passed,
                status=st.get("status"),http_status=st.get("http_status"),
                reports=len(reports),recent_30d=len(recent),latest=st.get("latest_publication"),
                invalid=len(bad),error=st.get("error",""),
                sample_urls=[r.get("original_url") for r in reports[:3]])
            except Exception as exc:
              evidence=dict(id=sid,technical_eligible=False,error=type(exc).__name__+":"+str(exc)[:200])
            print("EU_PARLIAMENT_PRE_ADMISSION",json.dumps(evidence,sort_keys=True),flush=True)
          print("NO_CATALOG_MUTATION_NO_RELEASE",flush=True)
          PY
