name: Source Expansion - EMA Health Pre-Admission
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-ema-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ema-direct-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install locked parser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Probe EMA official feeds as unadmitted candidates only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector, timestamp
          base = dict(adapter="rss", enabled=True, metadata_only=True, access_status="reviewed_public",
            independence="original", official=True, min_interval=1800, stale_after_days=30,
            retention_days=180, language="en", region="Europe / Global", country="",
            publisher_origin_id="eu_ema", category="Health",
            allowed_domains=["www.ema.europa.eu"],
            article_domains=["www.ema.europa.eu","ema.europa.eu"],
            attribution="European Medicines Agency (EMA); original link and date; no endorsement")
          endpoints = [
            ("ema_news_probe","https://www.ema.europa.eu/en/news.xml"),
            ("ema_new_human_probe","https://www.ema.europa.eu/en/new-human-medicine-new.xml"),
            ("ema_whats_new_probe","https://www.ema.europa.eu/en/whats-new.xml"),
            ("ema_withdrawn_probe","https://www.ema.europa.eu/en/withdrawn-applications.xml"),
          ]
          now = datetime.now(timezone.utc).timestamp(); good=[]
          for identity,url in endpoints:
              source = dict(base, id=identity, name=identity, url=url)
              try:
                  output = Collector(source).collect()
                  state = output["state"]; reports = output.get("reports", [])
                  recent = [r for r in reports if r.get("published_at")
                        and 0 <= now-timestamp(r["published_at"]) <= 30*86400]
                  invalid = [r for r in reports if r.get("summary") or r.get("media")
                    or not r.get("title") or not r.get("published_at") or not r.get("attribution")
                    or r.get("origin_id") != "eu_ema" or r.get("country_basis") != "publisher_coverage"
                    or urlsplit(r.get("url", "")).scheme != "https"
                    or urlsplit(r.get("url", "")).hostname not in source["article_domains"]]
                  passed = bool(state.get("status") == "available" and state.get("http_status") == 200
                    and reports and recent and not invalid)
                  out = dict(id=identity, url=url, passed=passed,status=state.get("status"),
                    http_status=state.get("http_status"),reports=len(reports),recent_30d=len(recent),
                    latest=state.get("latest_publication") or "",violations=len(invalid),error=state.get("error") or "")
                  if passed: good.append(identity)
              except Exception as exc:
                  out = dict(id=identity, url=url, passed=False,
                    error=f"{type(exc).__name__}: {str(exc)[:150]}")
              print("EMA_PRE_ADMISSION",json.dumps(out,sort_keys=True),flush=True)
          print("EMA_PROBE_COMPLETE",json.dumps(dict(passed=good,tested=len(endpoints),
            note="No catalog mutation or legal QA approval; fail-closed until post-admission checks.")),flush=True)
          PY
