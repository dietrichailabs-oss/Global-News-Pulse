name: R20 camera scale prelaunch
on:
  push:
    branches: [eng/r20-camera-scale-prelaunch-20261123]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camera:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Locked dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Camera integration and existing safeguards
        shell: bash
        run: |
          git merge-base --is-ancestor e0a067fdd1b9886da4742abdde950fcf32e10b7f HEAD
          python -m compileall -q global_pulse
          python -m pytest -q --tb=short tests/test_live_camera_integration_qa.py tests/test_live_camera_catalog.py tests/test_live_camera_player.py tests/test_global_camera_expansion.py tests/test_issue22_owner_media_lineup.py tests/test_camera_area_conflicts.py tests/test_camera_payload_admission.py tests/test_warmed_category_filter.py tests/test_websdr_expansion.py tests/test_r20_digital_radio.py tests/test_r20_owner_radio_feedback.py
          git diff --exit-code
  crisis:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Locked dependencies
        shell: bash
        run: |
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Crisis scope and display-cap regressions
        shell: bash
        run: |
          git merge-base --is-ancestor e0a067fdd1b9886da4742abdde950fcf32e10b7f HEAD
          python -m compileall -q global_pulse
          python -m pytest -q --tb=short tests/test_crisis_context_display_cap.py tests/test_issue22_owner_crisis_stripes.py tests/test_crisis_world_press.py tests/test_issue22_undated_crisis_freshness.py tests/test_issue22_idle_crisis_topic_screen.py tests/test_issue22_idle_crisis_single_credit.py tests/test_issue22_idle_map_evidence_index_worker.py tests/test_issue22_map_projection.py tests/test_issue82_batched_map_country_evidence.py tests/test_warmed_category_filter.py
          git diff --exit-code
