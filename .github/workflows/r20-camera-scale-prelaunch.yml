      - name: Candidate canonical alert and loaded desktop diagnostic
        shell: bash
        run: |
          python -m compileall -q global_pulse scripts/qa_r20_brief_loaded_archive.py
          for trial in 1 2; do
            R20_MATCHED_TRIAL="$trial" python -m scripts.qa_r20_brief_loaded_archive
          done
      - name: Matched exact predecessor diagnostic
        if: always()
        shell: bash
        run: |
          git worktree add --detach "$RUNNER_TEMP/gp-brief-predecessor" ccec1a711afbbf656f5f1f0f3303732cbe71365a
          probe="$PWD/scripts/qa_r20_brief_loaded_archive.py"
          cd "$RUNNER_TEMP/gp-brief-predecessor"
          for trial in 1 2; do
            R20_MATCHED_TRIAL="$trial" python -c 'import runpy,sys; p=sys.argv.pop(1); runpy.run_path(p,run_name="__main__")' "$probe" --baseline
          done
