name: Issue82 TV Error Readout - Scoped Windows Linux CI

on:
  push:
    branches: [eng/issue82-tv-error-receipts-20261115]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue82-tv-error-readout
  cancel-in-progress: true

jobs:
  focused-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install reviewed locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Guard frozen PR101 parent and three-path TV error scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 1909b745d81e0bae9f1495f5767147578ef645b5 HEAD
          git diff --name-only 1909b745d81e0bae9f1495f5767147578ef645b5..HEAD | python -c "import sys; expected={'global_pulse/single_media.py','tests/test_issue82_tv_error_readout.py','.github/workflows/issue82-tv-error-readout-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Real Windows Qt backend
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Syntax check
        shell: bash
        run: python -m compileall -q global_pulse tests/test_issue82_tv_error_readout.py tests/test_issue82_tv_visible_diagnostics.py
      - name: Real Qt TV provider errors, readable failures and media controls
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue82_tv_error_readout.py tests/test_issue82_tv_visible_diagnostics.py tests/test_issue82_startup_video_diagnostics.py tests/test_single_media.py tests/test_issue76_ham_tv_tray_tabs.py
      - name: Ensure tracked source not mutated by tests
        if: always()
        shell: bash
        run: git diff --exit-code
