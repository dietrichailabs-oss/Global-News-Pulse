name: QA Issue59 Cluster Hover Stress - Frozen Product

on:
  push:
    branches: [qa/issue59-hover-cluster-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-issue59-hover-cluster
  cancel-in-progress: true

jobs:
  adversarial-qa:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify exact product ancestor and only QA changes
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 50747372afc612c7a7013ce10dac5dc5d19044d8 HEAD
          git diff --name-only 50747372afc612c7a7013ce10dac5dc5d19044d8..HEAD | python -c "import sys; expected={'tests/test_qa_issue59_cluster_stress.py','.github/workflows/qa-issue59-cluster-stress.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile
        shell: bash
        run: python -m compileall -q global_pulse
      - name: Independent-scope cluster, map/country and incident provenance regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_qa_issue59_cluster_stress.py tests/test_issue58_map_paint_cache.py tests/test_owner_night_stability_map.py tests/test_issue22_map_pipeline.py
      - name: Verify unchanged tracked source
        if: always()
        shell: bash
        run: git diff --exit-code
