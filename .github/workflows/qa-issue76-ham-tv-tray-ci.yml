name: QA Issue76 Exact HAM / TV / Tray Negative Cases

on:
  push:
    branches: [qa/issue76-ham-tv-tray-adversarial-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-issue76-ham-tv-tray
  cancel-in-progress: true

jobs:
  adversarial-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Exact dependency locks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify exact frozen PR77 runtime and QA-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor b885ee98c80a280fede535903301871b9ebf1199 HEAD
          git diff --name-only b885ee98c80a280fede535903301871b9ebf1199..HEAD | python -c "import sys; expected={'tests/test_qa_issue76_adversarial.py','.github/workflows/qa-issue76-ham-tv-tray-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Use native Windows Qt backend for actual widget sizes
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Compile unchanged production code
        shell: bash
        run: python -m compileall -q global_pulse
      - name: QA-only HAM, video navigation and Qt tab/notification stress
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_qa_issue76_adversarial.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_issue31_tv_basic_player.py tests/test_issue21_sdr_owner_controls.py
      - name: Ensure tracked tree not changed
        if: always()
        shell: bash
        run: git diff --exit-code
