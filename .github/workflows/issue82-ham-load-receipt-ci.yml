name: Issue82 HAM Page Load Receipt - Scoped Windows Linux CI

on:
  push:
    branches: [eng/issue82-ham-connection-receipt-20261115]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue82-ham-load-receipt
  cancel-in-progress: true

jobs:
  focused-integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install reviewed locked requirements
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Guard exact PR94 packaged source ancestor and three-path diagnostic-only scope
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor ed976fb9fdfa18cf5b0166419a67a30e99805012 HEAD
          git diff --name-only ed976fb9fdfa18cf5b0166419a67a30e99805012..HEAD | python -c "import sys; expected={'global_pulse/internet_radio.py','tests/test_issue82_ham_load_receipts.py','.github/workflows/issue82-ham-load-receipt-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Real Windows Qt backend
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Syntax check
        shell: bash
        run: python -m compileall -q global_pulse tests/test_issue82_ham_load_receipts.py
      - name: HAM and GUI shutdown focused real Qt tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue82_ham_load_receipts.py tests/test_issue76_ham_tv_tray_tabs.py tests/test_issue82_collector_tray_latency.py tests/test_youtube_removal.py
      - name: Ensure tracked source not mutated by tests
        if: always()
        shell: bash
        run: git diff --exit-code
