name: Issue22 Idle Brief Worker Engineering
on:
  push:
    branches: [eng/issue22-idle-brief-worker-20261117]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Verify PR142 frozen parent and precise brief worker-only diff
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor fe152b0f0f5ebb07a4801047bc001bf3d02d88b2 HEAD
          git diff --name-only fe152b0f0f5ebb07a4801047bc001bf3d02d88b2 HEAD | python -c "import sys; expected={'.github/workflows/issue22-idle-brief-worker-ci.yml','global_pulse/ui.py','tests/test_issue22_idle_brief_worker.py'}; actual={p.strip() for p in sys.stdin if p.strip()}; assert actual==expected,(actual,expected)"
      - name: Native hosted Windows Qt
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'QT_QPA_PLATFORM=windows' >> "$GITHUB_ENV"
      - name: Exact source and inherited real Qt startup idle regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse tests/test_issue22_idle_brief_worker.py
          python -m pytest -s -q --tb=short tests/test_issue22_idle_brief_worker.py tests/test_issue22_idle_filter_options_worker.py tests/test_issue22_idle_source_status_noop.py tests/test_issue22_idle_map_classification_worker.py tests/test_issue22_idle_collector_snapshot.py tests/test_issue22_idle_crisis_single_credit.py tests/test_issue22_idle_crisis_topic_screen.py tests/test_issue22_idle_economy_revision_snapshot.py tests/test_issue22_idle_feed_inplace.py tests/test_issue22_idle_coverage_single_pass.py tests/test_issue22_startup_idle_profile.py tests/test_issue22_country_only_drilldown.py tests/test_issue58_map_paint_cache.py tests/test_issue64_daily_weekly_archive.py tests/test_issue64_intelligence_brief.py
      - name: Verify tracked source remains clean
        if: always()
        shell: bash
        run: git diff --exit-code
