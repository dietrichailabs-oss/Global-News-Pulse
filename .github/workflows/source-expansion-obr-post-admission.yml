name: Source Expansion - OBR Post-Admission Provenance and Live
on:
  push:
    branches: [eng/source-expansion-open-feeds-20261113]
    paths:
      - .github/workflows/source-expansion-obr-post-admission.yml
      - global_pulse/resources/sources.json
      - tests/test_source_expansion_obr.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  obr-post-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Exact catalog OBR parser provenance and publisher origin regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q tests/test_source_expansion_obr.py tests/test_issue22_publisher_origin_group.py tests/test_source_expansion_se_uk.py
      - name: Recheck exact enabled OBR feed direct via locked Collector
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from urllib.parse import urlsplit
          from global_pulse.sources import Collector,load_catalog,timestamp
          source={r["id"]:r for r in load_catalog()}["uk_obr_news"]
          now=datetime.now(timezone.utc).timestamp()
          response=Collector(source).collect()
          reports=response.get("reports",[]);st=response["state"]
          recent=[r for r in reports if r.get("published_at") and 0<=now-timestamp(r["published_at"])<=30*86400]
          violations=[r for r in reports if not r.get("title") or not r.get("published_at")
            or not r.get("attribution") or r.get("attribution")!=source["attribution"]
            or r.get("summary") or r.get("media") or r.get("origin_id")!="uk_obr"
            or r.get("country_basis")!="publisher_coverage"
            or r.get("latitude") is not None or r.get("longitude") is not None
            or r.get("url")!=r.get("original_url")
            or urlsplit(r.get("url","")).scheme!="https"
            or urlsplit(r.get("url","")).hostname not in source["article_domains"]]
          passed=bool(st.get("status")=="available" and st.get("http_status")==200
              and len(reports)>0 and len(recent)>0 and not violations
              and source.get("enabled") and source.get("metadata_only"))
          print("OBR_POST_ADMISSION",json.dumps(dict(passed=passed,id=source["id"],
            url=source["url"],publisher_origin_id=source["publisher_origin_id"],
            status=st.get("status"),http_status=st.get("http_status"),
            reports=len(reports),recent_30d=len(recent),latest=st.get("latest_publication"),
            violations=len(violations),error=st.get("error",""),
            sample_original_links=[r.get("original_url") for r in reports[:2]]),
            sort_keys=True),flush=True)
          if not passed: raise SystemExit("OBR post-admission gate FAIL")
          PY
