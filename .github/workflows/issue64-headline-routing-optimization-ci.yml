name: Issue64 Engineering Bounded Headline Routing and GUI Profile

on:
  push:
    branches: [eng/issue64-bounded-language-route-cache-20261114]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue64-bounded-language-route-cache
  cancel-in-progress: true

jobs:
  engineering-route-cache:
    name: Bounded headline routing (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
      PYTHONNOUSERSITE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PIP_NO_INPUT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libegl1 libopengl0 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libpulse0
      - name: Install pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --require-hashes --no-build-isolation -r requirements-bootstrap.lock
          python -m pip install --require-hashes --no-build-isolation -r requirements-build.lock
      - name: Guard frozen profiler parent and exact three-path production delta
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 17926897a1c670e420c9f9caa5cb70a5e5cc04b1 HEAD
          git diff --name-only 17926897a1c670e420c9f9caa5cb70a5e5cc04b1..HEAD | python -c "import sys; expected={'global_pulse/headline_translation.py','tests/test_issue64_bounded_headline_routing.py','.github/workflows/issue64-headline-routing-optimization-ci.yml'}; actual={x.strip() for x in sys.stdin if x.strip()}; assert actual==expected,(actual,expected)"
      - name: Compile accepted application and independent diagnostic test
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q global_pulse
          python -m py_compile tests/test_issue64_bounded_headline_routing.py tests/test_issue64_gui_latency_profile.py
      - name: Source routing, translation and preserved evidence regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q --tb=short tests/test_issue64_bounded_headline_routing.py tests/test_source_capacity_headlines.py tests/test_headline_desktop_flow.py tests/test_issue22_unknown_language.py tests/test_issue64_intelligence_brief.py
      - name: Compare actual GUI latency on identical offline SQLite and Qt path
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q -s --tb=short tests/test_issue64_gui_latency_profile.py
      - name: No tracked file mutations
        if: always()
        shell: bash
        run: git diff --exit-code
